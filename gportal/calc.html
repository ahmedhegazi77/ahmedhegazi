<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>الآلة الحاسبة الذهبية | شبراخيث</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
    * {
        font-family: 'Cairo', sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(145deg, #87CEEB 0%, #5F9EA0 50%, #4682B4 100%);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    /* ===== خلفية متحركة بجلانس ذهبي ===== */
    body::before {
        content: '';
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 40%, rgba(255,215,0,0.25) 0%, transparent 30%),
                    radial-gradient(circle at 70% 60%, rgba(255,215,0,0.25) 0%, transparent 30%),
                    repeating-linear-gradient(45deg, 
                        transparent 0px, 
                        transparent 30px, 
                        rgba(255,215,0,0.1) 30px, 
                        rgba(255,215,0,0.1) 60px);
        animation: glisten 15s linear infinite;
        pointer-events: none;
        z-index: 0;
    }

    @keyframes glisten {
        0% { transform: rotate(0deg) scale(1); opacity: 0.5; }
        50% { transform: rotate(180deg) scale(1.3); opacity: 1; }
        100% { transform: rotate(360deg) scale(1); opacity: 0.5; }
    }

    /* ===== جلانس ذهبي متحرك عكسي ===== */
    body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(90deg, 
            transparent 0px, 
            transparent 20px, 
            rgba(255,215,0,0.15) 20px, 
            rgba(255,215,0,0.15) 40px);
        animation: glistenReverse 20s linear infinite;
        pointer-events: none;
        z-index: 0;
        filter: blur(2px);
    }

    @keyframes glistenReverse {
        0% { transform: translateX(0) scale(1); opacity: 0.3; }
        50% { transform: translateX(-100px) scale(1.3); opacity: 0.8; }
        100% { transform: translateX(0) scale(1); opacity: 0.3; }
    }

    /* ===== زر العودة للبوابة (أسفل اليسار) ===== */
    .portal-btn {
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: 70px;
        height: 70px;
        background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10000;
        border: 4px solid white;
        box-shadow: 0 0 50px #ffd700, 0 0 100px #ffaa00, inset 0 0 20px white;
        animation: portalPulse 2s infinite;
        text-decoration: none;
    }

    @keyframes portalPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 50px #ffd700, 0 0 100px #ffaa00; }
        50% { transform: scale(1.2); box-shadow: 0 0 80px #ffd700, 0 0 150px #ffaa00, 0 0 200px #ffff00; }
    }

    .portal-btn i {
        font-size: 35px;
        color: white;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    /* ===== زر التحكم في الموسيقى (أسفل اليمين) ===== */
    .music-control-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 70px;
        height: 70px;
        background: radial-gradient(circle at 30% 30%, #e0e0e0, #b0b0b0);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10000;
        border: 4px solid #ffd700;
        box-shadow: 0 0 30px #ffd700, 0 0 60px #ffaa00, inset 0 0 10px white;
        transition: all 0.3s;
        text-decoration: none;
    }

    .music-control-btn:hover {
        transform: scale(1.1);
        background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
        box-shadow: 0 0 50px #ffd700, 0 0 100px #ffaa00;
    }

    .music-control-btn i {
        font-size: 35px;
        color: #2c3e50;
        transition: all 0.3s;
    }

    .music-control-btn:hover i {
        color: white;
    }

    .music-control-btn.playing {
        background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
    }

    .music-control-btn.playing i {
        color: white;
    }

    /* ===== صندوق الحاسبة ===== */
    .calculator {
        background: linear-gradient(145deg, #e0e0e0, #b0b0b0);
        padding: 25px;
        border-radius: 50px;
        border: 4px solid rgba(255,215,0,0.5);
        box-shadow: 
            0 20px 40px rgba(0,0,0,0.3),
            inset 0 -3px 5px rgba(0,0,0,0.2),
            inset 0 3px 5px rgba(255,255,255,0.9);
        width: 400px;
        max-width: 100%;
        text-align: center;
        animation: slideIn 0.5s ease;
        position: relative;
        overflow: hidden;
        z-index: 10;
    }

    .calculator::before {
        content: '';
        position: absolute;
        top: -5px;
        left: -5px;
        right: -5px;
        bottom: -5px;
        border-radius: 55px;
        background: linear-gradient(45deg, #ffd700, #ffff00, #ffd700, #ffff00);
        opacity: 0;
        transition: opacity 0.4s;
        z-index: -1;
        filter: blur(5px);
    }

    .calculator:hover::before {
        opacity: 1;
        animation: glowRotate 2s linear infinite;
    }

    @keyframes glowRotate {
        0% { transform: rotate(0deg); filter: blur(5px); }
        100% { transform: rotate(360deg); filter: blur(8px); }
    }

    @keyframes slideIn {
        from { transform: translateY(-50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* العنوان */
    .calculator h2 {
        color: #2c3e50;
        margin-bottom: 20px;
        font-size: 28px;
        text-shadow: 2px 2px 4px rgba(255,215,0,0.3);
    }

    /* شاشة العرض */
    #display {
        width: 100%;
        height: 70px;
        font-size: 32px;
        margin-bottom: 20px;
        text-align: left;
        padding: 10px 15px;
        border-radius: 50px;
        border: 3px solid #ffd700;
        background: rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        font-family: 'Courier New', monospace;
        box-sizing: border-box;
        direction: ltr;
        color: #2c3e50;
        font-weight: bold;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }

    /* الأزرار */
    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 15px;
    }

    button {
        padding: 18px;
        font-size: 22px;
        border: 3px solid rgba(255,215,0,0.3);
        border-radius: 50px;
        cursor: pointer;
        background: linear-gradient(145deg, #f0f0f0, #d0d0d0);
        transition: all 0.3s ease;
        font-weight: bold;
        box-shadow: 0 5px 10px rgba(0,0,0,0.2), inset 0 -2px 3px rgba(0,0,0,0.1);
        color: #2c3e50;
    }

    button:hover {
        transform: translateY(-3px);
        background: linear-gradient(145deg, #ffd700, #b8860b);
        color: white;
        border-color: white;
        box-shadow: 0 8px 15px rgba(255,215,0,0.4);
    }

    button:active {
        transform: translateY(0) scale(0.95);
    }

    /* أزرار الأرقام */
    .number {
        background: linear-gradient(145deg, #ffffff, #e0e0e0);
    }

    /* أزرار العمليات */
    .operator {
        background: linear-gradient(145deg, #ffd166, #f0b400);
        color: #2c3e50;
        font-size: 26px;
    }

    /* زر المسح */
    .clear {
        background: linear-gradient(145deg, #ff6b6b, #ff5252);
        color: white;
        font-size: 22px;
    }

    /* زر النتيجة */
    .equal {
        background: linear-gradient(145deg, #4ecdc4, #45b7aa);
        color: white;
        font-size: 26px;
        grid-column: span 2;
    }

    /* زر الصفر */
    .zero {
        grid-column: span 2;
    }

    /* زر العلامة العشرية */
    .decimal {
        font-size: 26px;
    }

    /* زر المسح الخلفي */
    .backspace {
        background: linear-gradient(145deg, #ffa26b, #ff8c42);
        color: white;
        font-size: 22px;
    }

    /* جزيئات ضوئية */
    .light-particle {
        position: fixed;
        width: 8px;
        height: 8px;
        background: #ffd700;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        animation: particleFloat 1.5s forwards;
        box-shadow: 0 0 20px #ffd700;
    }

    @keyframes particleFloat {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(4) translateY(-80px); opacity: 0; }
    }

    @media (max-width: 480px) {
        .calculator {
            padding: 15px;
        }
        
        button {
            padding: 15px;
            font-size: 18px;
        }
        
        #display {
            height: 60px;
            font-size: 26px;
        }
        
        .portal-btn, .music-control-btn {
            width: 55px;
            height: 55px;
            bottom: 10px;
        }
        
        .portal-btn i, .music-control-btn i {
            font-size: 28px;
        }
    }
</style>
</head>
<body>

<!-- زر العودة للبوابة -->
<a href="secschool.html" class="portal-btn" id="portalBtn">
    <i>🏠</i>
</a>

<!-- زر التحكم في الموسيقى -->
<div class="music-control-btn" id="musicControlBtn" onclick="toggleMusic()">
    <i id="musicIcon">🔊</i>
</div>

<!-- موسيقى خلفية -->
<audio id="bgMusic" loop>
    <source src="music.wav" type="audio/mpeg">
</audio>

<div class="calculator">
    <h2>🧮 الآلة الحاسبة الذهبية</h2>
    
    <input type="text" id="display" value="0" readonly>

    <div class="buttons">
        <button onclick="clearDisplay()" class="clear">C</button>
        <button onclick="backspace()" class="backspace">⌫</button>
        <button onclick="appendValue('/')" class="operator">÷</button>
        <button onclick="appendValue('*')" class="operator">×</button>

        <button onclick="appendValue('7')" class="number">7</button>
        <button onclick="appendValue('8')" class="number">8</button>
        <button onclick="appendValue('9')" class="number">9</button>
        <button onclick="appendValue('-')" class="operator">−</button>

        <button onclick="appendValue('4')" class="number">4</button>
        <button onclick="appendValue('5')" class="number">5</button>
        <button onclick="appendValue('6')" class="number">6</button>
        <button onclick="appendValue('+')" class="operator">+</button>

        <button onclick="appendValue('1')" class="number">1</button>
        <button onclick="appendValue('2')" class="number">2</button>
        <button onclick="appendValue('3')" class="number">3</button>
        
        <button onclick="appendValue('0')" class="number zero">0</button>
        <button onclick="appendValue('.')" class="decimal">.</button>
        <button onclick="calculate()" class="equal">=</button>
    </div>
</div>

<script>
    // ===== نظام الموسيقى =====
    let music = document.getElementById('bgMusic');
    let musicBtn = document.getElementById('musicControlBtn');
    let musicIcon = document.getElementById('musicIcon');
    let isPlaying = false;

    music.load();

    function toggleMusic() {
        if (isPlaying) {
            music.pause();
            musicIcon.textContent = '🔇';
            musicBtn.classList.remove('playing');
        } else {
            music.play().then(() => {
                musicIcon.textContent = '🔊';
                musicBtn.classList.add('playing');
            }).catch(e => console.log('ممنوع تشغيل الموسيقى'));
        }
        isPlaying = !isPlaying;
        createLightParticle(event?.clientX || window.innerWidth/2, event?.clientY || window.innerHeight/2);
    }

    function playMusic() {
        if (!isPlaying) {
            music.play().then(() => {
                isPlaying = true;
                musicIcon.textContent = '🔊';
                musicBtn.classList.add('playing');
            }).catch(e => console.log('ممنوع تشغيل الموسيقى تلقائياً'));
        }
    }

    // ===== جزيئات ضوئية ذهبية =====
    function createLightParticle(x, y) {
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                const particle = document.createElement('div');
                particle.className = 'light-particle';
                particle.style.left = (x || window.innerWidth/2) + (Math.random() - 0.5) * 80 + 'px';
                particle.style.top = (y || window.innerHeight/2) + (Math.random() - 0.5) * 80 + 'px';
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 1500);
            }, i * 50);
        }
    }

    // جزيئات مع حركة الماوس
    document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.95) {
            createLightParticle(e.clientX, e.clientY);
        }
    });

    // ===== دوال الحاسبة =====
    function appendValue(value) {
        const display = document.getElementById("display");
        
        if (display.value === "0" || display.value === "خطأ") {
            display.value = value;
        } else {
            display.value += value;
        }
        playMusic();
        createLightParticle(event?.clientX, event?.clientY);
    }

    function clearDisplay() {
        document.getElementById("display").value = "0";
        playMusic();
        createLightParticle(event?.clientX, event?.clientY);
    }

    function backspace() {
        const display = document.getElementById("display");
        display.value = display.value.slice(0, -1);
        
        if (display.value === "") {
            display.value = "0";
        }
        playMusic();
        createLightParticle(event?.clientX, event?.clientY);
    }

    function calculate() {
        try {
            const display = document.getElementById("display");
            let expression = display.value;
            
            expression = expression.replace(/×/g, '*');
            expression = expression.replace(/÷/g, '/');
            expression = expression.replace(/−/g, '-');
            
            let result = eval(expression);
            
            if (result.toString().includes('.')) {
                result = Math.round(result * 1000000) / 1000000;
            }
            
            display.value = result;
        } catch {
            document.getElementById("display").value = "خطأ";
        }
        playMusic();
        createLightParticle(event?.clientX, event?.clientY);
    }

    // دعم لوحة المفاتيح
    document.addEventListener('keydown', function(event) {
        const key = event.key;
        
        if (/[0-9]/.test(key)) {
            appendValue(key);
        } else if (key === '+') appendValue('+');
        else if (key === '-') appendValue('-');
        else if (key === '*') appendValue('*');
        else if (key === '/') appendValue('/');
        else if (key === '.') appendValue('.');
        else if (key === 'Enter' || key === '=') calculate();
        else if (key === 'Escape') clearDisplay();
        else if (key === 'Backspace') backspace();
        
        if (key === ' ') event.preventDefault();
    });

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Backspace') {
            event.preventDefault();
        }
    });

    // جزيئات عند التحميل
    window.addEventListener('load', () => {
        for (let i = 0; i < 10; i++) {
            setTimeout(() => {
                createLightParticle(Math.random() * window.innerWidth, Math.random() * window.innerHeight);
            }, i * 100);
        }
    });
</script>

</body>
</html>
