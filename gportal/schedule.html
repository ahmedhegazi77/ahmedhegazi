<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>نظام الجداول الذكي | شبراخيث</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(145deg, #87CEEB 0%, #5F9EA0 50%, #4682B4 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            text-align: center;
        }

        /* ===== خلفية متحركة بجلانس فضي وذهبي ===== */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255,215,0,0.25) 0%, transparent 30%),
                        radial-gradient(circle at 70% 60%, rgba(192,192,192,0.25) 0%, transparent 30%),
                        repeating-linear-gradient(45deg, 
                            transparent 0px, 
                            transparent 30px, 
                            rgba(255,215,0,0.1) 30px, 
                            rgba(192,192,192,0.1) 60px);
            animation: glisten 15s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes glisten {
            0% { transform: rotate(0deg) scale(1); opacity: 0.5; }
            50% { transform: rotate(180deg) scale(1.3); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.5; }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(90deg, 
                transparent 0px, 
                transparent 20px, 
                rgba(255,215,0,0.15) 20px, 
                rgba(192,192,192,0.15) 40px);
            animation: glistenReverse 20s linear infinite;
            pointer-events: none;
            z-index: 0;
            filter: blur(2px);
        }

        @keyframes glistenReverse {
            0% { transform: translateX(0) scale(1); opacity: 0.3; }
            50% { transform: translateX(-100px) scale(1.3); opacity: 0.8; }
            100% { transform: translateX(0) scale(1); opacity: 0.3; }
        }

        /* ===== زر الموسيقى (أسفل اليمين) ===== */
        .music-control-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #c0c0c0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            border: 4px solid white;
            box-shadow: 0 0 30px #ffd700, 0 0 60px #c0c0c0, inset 0 0 10px white;
            transition: all 0.3s;
            text-decoration: none;
        }

        .music-control-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px #ffd700, 0 0 100px #c0c0c0;
        }

        .music-control-btn i {
            font-size: 35px;
            color: #2c3e50;
            transition: all 0.3s;
        }

        .music-control-btn:hover i {
            color: white;
        }

        .music-control-btn.playing {
            background: radial-gradient(circle at 30% 30%, #c0c0c0, #ffd700);
        }

        .music-control-btn.playing i {
            color: white;
        }

        /* ===== العينان في الشمال فوق ===== */
        .eyes-container {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
            z-index: 10000;
            filter: drop-shadow(0 0 30px #ffd700);
            animation: eyesFloat 3s infinite alternate;
            pointer-events: none;
        }

        @keyframes eyesFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .eye {
            position: relative;
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
            border: 4px solid #ffd700;
            overflow: hidden;
            box-shadow: 0 0 30px #ffd700, 0 0 60px #c0c0c0;
            transition: all 0.3s;
        }

        .eyeball {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f0f0;
            border-radius: inherit;
        }

        .pupil {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #c0c0c0, #ffd700);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
            box-shadow: 0 0 20px #ffd700;
            border: 2px solid white;
        }

        .pupil::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            opacity: 0.9;
            box-shadow: 0 0 10px white;
        }

        /* تأثير النقر المتوسع */
        .ripple-effect {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.8), rgba(192,192,192,0.8));
            pointer-events: none;
            z-index: 9999;
            animation: ripple 0.6s ease-out forwards;
        }

        @keyframes ripple {
            0% { width: 0; height: 0; opacity: 0.8; }
            100% { width: 500px; height: 500px; opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        /* جزيئات ضوئية */
        .light-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ffd700, #c0c0c0);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            animation: particleFloat 1.5s forwards;
            box-shadow: 0 0 20px #ffd700;
        }

        @keyframes particleFloat {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(4) translateY(-80px); opacity: 0; }
        }

        /* الهيدر المطور */
        header {
            background: linear-gradient(145deg, #c0c0c0, #a0a0a0);
            color: #2c3e50;
            padding: 30px 20px;
            border-radius: 0 0 60px 60px;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
            border-bottom: 4px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-size: 28px;
            font-weight: 800;
        }

        header small {
            font-size: 16px;
            display: block;
            opacity: 0.8;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .panel {
            background: linear-gradient(145deg, #c0c0c0, #a0a0a0);
            border-radius: 60px;
            padding: 30px;
            margin-bottom: 25px;
            border: 3px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 200%;
            height: 100%;
            background: linear-gradient(120deg, 
                transparent 0%, 
                transparent 30%, 
                rgba(255, 215, 0, 0.2) 45%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 215, 0, 0.2) 55%,
                transparent 70%,
                transparent 100%);
            transform: skewX(-20deg);
            animation: shine 8s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% { left: -150%; }
            100% { left: 150%; }
        }

        .panel h3 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 20px;
            position: relative;
            z-index: 5;
        }

        .portalBtn {
            background: linear-gradient(145deg, #ffd700, #c0c0c0);
            border: 3px solid white;
            color: #2c3e50;
            padding: 15px 35px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255,215,0,0.3);
        }

        .portalBtn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255,215,0,0.5);
        }

        .formGrid {
            display: grid;
            grid-template-columns: 1fr;
            row-gap: 15px;
            text-align: right;
            max-width: 400px;
            margin: auto;
            position: relative;
            z-index: 5;
        }

        .field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #ffd700;
        }

        .field label {
            color: #2c3e50;
            font-weight: 600;
            font-size: 18px;
        }

        input {
            width: 100px;
            padding: 10px;
            border-radius: 40px;
            border: 2px solid #ffd700;
            background: white;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        .days {
            margin-top: 20px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 50px;
            border: 1px solid #ffd700;
            position: relative;
            z-index: 5;
        }

        .days b {
            color: #2c3e50;
            font-size: 18px;
            display: block;
            margin-bottom: 15px;
        }

        .days label {
            margin-left: 15px;
            color: #2c3e50;
            font-size: 16px;
            cursor: pointer;
        }

        .days input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-left: 5px;
            accent-color: #ffd700;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
            position: relative;
            z-index: 5;
        }

        button {
            background: linear-gradient(145deg, #ffd700, #c0c0c0);
            border: 3px solid white;
            color: #2c3e50;
            padding: 12px 30px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255,215,0,0.3);
            font-family: 'Cairo', sans-serif;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255,215,0,0.5);
        }

        button:active {
            animation: clickRipple 0.4s ease-out;
        }

        .save {
            background: linear-gradient(145deg, #4CAF50, #45a049);
        }

        .save:hover {
            background: linear-gradient(145deg, #45a049, #4CAF50);
        }

        .tableTitle {
            font-size: 34px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255,215,0,0.3);
            position: relative;
            z-index: 5;
        }

        /* ===== جدول العرض (للشاشة) ===== */
        .display-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 18px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            overflow: hidden;
            border: 3px solid #ffd700;
            position: relative;
            z-index: 5;
        }

        .display-table th, .display-table td {
            padding: 15px;
            border: 2px solid #ffd700;
            color: #2c3e50;
        }

        .display-table th {
            background: linear-gradient(145deg, #ffd700, #c0c0c0);
            color: #2c3e50;
            font-weight: bold;
        }

        .display-table td {
            background: rgba(255,255,255,0.1);
        }

        .display-table .break {
            background: rgba(255, 193, 7, 0.2);
            font-weight: bold;
        }

        .display-table .assembly {
            background: rgba(76, 175, 80, 0.2);
            font-weight: bold;
        }

        /* ===== جدول الطباعة (أبيض بخط كبير) ===== */
        .print-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 22px;
            background: white;
            color: black;
            border: 2px solid black;
        }

        .print-table th, .print-table td {
            padding: 18px 12px;
            border: 2px solid black;
            color: black;
            font-weight: normal;
        }

        .print-table th {
            background: #f0f0f0;
            color: black;
            font-weight: bold;
        }

        .print-table .break {
            background: #f9f9f9;
            font-weight: bold;
        }

        .print-table .assembly {
            background: #f0f0f0;
            font-weight: bold;
        }

        .notes {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 50px;
            font-size: 18px;
            margin-top: 20px;
            border: 2px solid #ffd700;
            color: #2c3e50;
            position: relative;
            z-index: 5;
        }

        .print-notes {
            background: white;
            padding: 15px;
            border: 1px solid black;
            color: black;
            font-size: 18px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .music-control-btn { width: 55px; height: 55px; }
            .eye { width: 55px; height: 55px; }
            .panel { padding: 20px; }
            .display-table { font-size: 16px; }
            .display-table th, .display-table td { padding: 10px; }
        }
    </style>
</head>
<body>

<!-- موسيقى خلفية -->
<audio id="bgMusic" loop>
    <source src="music.wav" type="audio/mpeg">
</audio>

<!-- زر الموسيقى -->
<div class="music-control-btn" id="musicControlBtn" onclick="toggleMusic(event)">
    <i id="musicIcon">🔊</i>
</div>

<!-- العيون في الشمال فوق -->
<div class="eyes-container">
    <div class="eye eye-left">
        <div class="eyeball">
            <div class="pupil" id="leftPupil"></div>
        </div>
    </div>
    <div class="eye eye-right">
        <div class="eyeball">
            <div class="pupil" id="rightPupil"></div>
        </div>
    </div>
</div>

<header>
    نظام الجداول الذكي
    <small>مدرسة شبراخيث الثانوية بنات</small>
</header>

<div class="container">

    <button class="portalBtn" onclick="window.location.href='secschool.html'; createRipple(event)">🏫 العودة للبوابة</button>

    <div class="panel">
        <h3>⚙️ إعدادات الجدول</h3>

        <div class="formGrid">
            <div class="field">
                <label>⏰ بداية اليوم</label>
                <input type="time" id="startTime" value="08:00">
            </div>

            <div class="field">
                <label>🏃 طابور الصباح</label>
                <input type="number" id="assembly" value="10">
            </div>

            <div class="field">
                <label>📚 الحصة قبل الفسحة</label>
                <input type="number" id="lessonBefore" value="45">
            </div>

            <div class="field">
                <label>📚 الحصة بعد الفسحة</label>
                <input type="number" id="lessonAfter" value="45">
            </div>

            <div class="field">
                <label>🍽️ مدة الفسحة</label>
                <input type="number" id="breakTime" value="20">
            </div>

            <div class="field">
                <label>🔢 عدد الحصص</label>
                <input type="number" id="lessons" value="7">
            </div>
        </div>

        <div class="days">
            <b>📅 أيام بها 7 حصص:</b>
            <label><input type="checkbox" value="السبت"> السبت</label>
            <label><input type="checkbox" value="الأحد"> الأحد</label>
            <label><input type="checkbox" value="الاثنين"> الاثنين</label>
            <label><input type="checkbox" value="الثلاثاء"> الثلاثاء</label>
            <label><input type="checkbox" value="الأربعاء"> الأربعاء</label>
            <label><input type="checkbox" value="الخميس"> الخميس</label>
        </div>

        <div class="action-buttons">
            <button onclick="generateTable(); createRipple(event); playMusic(event)">✨ إنشاء الجدول</button>
            <button class="save" onclick="prepareAndSavePDF(); createRipple(event); playMusic(event)">💾 حفظ PDF للطباعة</button>
        </div>
    </div>

    <div class="panel" id="resultPanel">
        <div class="tableTitle">
            📋 جدول الحصص
        </div>
        <div id="tableArea"></div>
        <div class="notes" id="notes"></div>
    </div>

    <!-- عنصر مخفي للطباعة (نسخة أبيض بخط كبير) -->
    <div id="printContainer" style="display: none;"></div>

</div>

<script>
    const lessonNames = [
        "الحصة الأولى",
        "الحصة الثانية",
        "الحصة الثالثة",
        "الحصة الرابعة",
        "الحصة الخامسة",
        "الحصة السادسة",
        "الحصة السابعة",
        "الحصة الثامنة"
    ];

    // ===== نظام الموسيقى =====
    let music = document.getElementById('bgMusic');
    let musicBtn = document.getElementById('musicControlBtn');
    let musicIcon = document.getElementById('musicIcon');
    let isPlaying = false;

    music.load();

    window.toggleMusic = function(event) {
        event.stopPropagation();
        if (isPlaying) {
            music.pause();
            musicIcon.textContent = '🔇';
            musicBtn.classList.remove('playing');
        } else {
            music.play().then(() => {
                musicIcon.textContent = '🔊';
                musicBtn.classList.add('playing');
            }).catch(e => console.log('ممنوع تشغيل الموسيقى'));
        }
        isPlaying = !isPlaying;
        createLightParticle(event?.clientX || window.innerWidth/2, event?.clientY || window.innerHeight/2);
    }

    window.playMusic = function(event) {
        if (!isPlaying && event) {
            music.play().then(() => {
                isPlaying = true;
                musicIcon.textContent = '🔊';
                musicBtn.classList.add('playing');
            }).catch(e => console.log('ممنوع تشغيل الموسيقى تلقائياً'));
        }
    }

    // ===== العيون تتبع الماوس =====
    const leftPupil = document.querySelector('.eye-left .pupil');
    const rightPupil = document.querySelector('.eye-right .pupil');
    const pupils = [leftPupil, rightPupil];

    document.addEventListener('mousemove', function(e) {
        pupils.forEach(pupil => {
            const eye = pupil.closest('.eye');
            const eyeRect = eye.getBoundingClientRect();
            const eyeCenterX = eyeRect.left + eyeRect.width / 2;
            const eyeCenterY = eyeRect.top + eyeRect.height / 2;
            
            const deltaX = e.clientX - eyeCenterX;
            const deltaY = e.clientY - eyeCenterY;
            
            const angle = Math.atan2(deltaY, deltaX);
            const distance = Math.min(12, Math.sqrt(deltaX * deltaX + deltaY * deltaY) / 15);
            
            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;
            
            pupil.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
        });
    });

    // ===== تأثير النقر المتوسع =====
    window.createRipple = function(event) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple-effect';
        
        const x = event.clientX;
        const y = event.clientY;
        
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.style.transform = 'translate(-50%, -50%)';
        
        document.body.appendChild(ripple);
        
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                createLightParticle(x, y);
            }, i * 50);
        }
        
        setTimeout(() => {
            ripple.remove();
        }, 600);
    }

    function createLightParticle(x, y) {
        const particle = document.createElement('div');
        particle.className = 'light-particle';
        particle.style.left = (x || window.innerWidth/2) + (Math.random() - 0.5) * 100 + 'px';
        particle.style.top = (y || window.innerHeight/2) + (Math.random() - 0.5) * 100 + 'px';
        document.body.appendChild(particle);
        
        setTimeout(() => {
            particle.remove();
        }, 1500);
    }

    document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.95) {
            createLightParticle(e.clientX, e.clientY);
        }
    });

    window.addEventListener('load', () => {
        for (let i = 0; i < 20; i++) {
            setTimeout(() => {
                createLightParticle(Math.random() * window.innerWidth, Math.random() * window.innerHeight);
            }, i * 100);
        }
        generateTable(); // إنشاء جدول افتراضي عند التحميل
    });

    function addMinutes(time, mins) {
        let [h, m] = time.split(":").map(Number);
        let d = new Date();
        d.setHours(h);
        d.setMinutes(m + mins);
        return d.toTimeString().slice(0, 5);
    }

    // توليد جدول العرض (النسخة الجميلة)
    function generateTable() {
        let start = document.getElementById("startTime").value;
        let assembly = parseInt(document.getElementById("assembly").value);
        let before = parseInt(document.getElementById("lessonBefore").value);
        let after = parseInt(document.getElementById("lessonAfter").value);
        let breakTime = parseInt(document.getElementById("breakTime").value);
        let lessons = parseInt(document.getElementById("lessons").value);

        let html = '<table class="display-table">';
        html += "<tr><th>الفترة</th><th>من</th><th>إلى</th></tr>";

        let assemblyEnd = addMinutes(start, assembly);

        html += `
        <tr class="assembly">
            <td>🏃 طابور الصباح</td>
            <td>${start}</td>
            <td>${assemblyEnd}</td>
        </tr>
        `;

        let current = assemblyEnd;

        for (let i = 1; i <= lessons; i++) {
            let duration = i <= 4 ? before : after;
            let end = addMinutes(current, duration);

            html += `
            <tr>
                <td>📖 ${lessonNames[i-1]}</td>
                <td>${current}</td>
                <td>${end}</td>
            </tr>
            `;

            current = end;

            if (i == 4) {
                let breakEnd = addMinutes(current, breakTime);
                html += `
                <tr class="break">
                    <td>🍽️ الفسحة</td>
                    <td>${current}</td>
                    <td>${breakEnd}</td>
                </tr>
                `;
                current = breakEnd;
            }
        }

        html += "</table>";
        document.getElementById("tableArea").innerHTML = html;
        generateNotes();
    }

    function generateNotes() {
        let days = [];
        document.querySelectorAll(".days input:checked").forEach(el => days.push(el.value));

        if (days.length > 0) {
            document.getElementById("notes").innerHTML = 
                "<b>📝 ملاحظات:</b> الأيام التي بها 7 حصص: " + days.join(" ، ");
        } else {
            document.getElementById("notes").innerHTML = "";
        }
    }

    // توليد جدول الطباعة (نسخة أبيض بخط كبير)
    function generatePrintTable() {
        let start = document.getElementById("startTime").value;
        let assembly = parseInt(document.getElementById("assembly").value);
        let before = parseInt(document.getElementById("lessonBefore").value);
        let after = parseInt(document.getElementById("lessonAfter").value);
        let breakTime = parseInt(document.getElementById("breakTime").value);
        let lessons = parseInt(document.getElementById("lessons").value);

        let html = '<table class="print-table" style="font-size: 24px;">';
        html += "<tr><th>الفترة</th><th>من</th><th>إلى</th></tr>";

        let assemblyEnd = addMinutes(start, assembly);

        html += `
        <tr class="assembly">
            <td>طابور الصباح</td>
            <td>${start}</td>
            <td>${assemblyEnd}</td>
        </tr>
        `;

        let current = assemblyEnd;

        for (let i = 1; i <= lessons; i++) {
            let duration = i <= 4 ? before : after;
            let end = addMinutes(current, duration);

            html += `
            <tr>
                <td>${lessonNames[i-1]}</td>
                <td>${current}</td>
                <td>${end}</td>
            </tr>
            `;

            current = end;

            if (i == 4) {
                let breakEnd = addMinutes(current, breakTime);
                html += `
                <tr class="break">
                    <td>الفسحة</td>
                    <td>${current}</td>
                    <td>${breakEnd}</td>
                </tr>
                `;
                current = breakEnd;
            }
        }

        html += "</table>";

        // إضافة الملاحظات بنسخة للطباعة
        let days = [];
        document.querySelectorAll(".days input:checked").forEach(el => days.push(el.value));

        if (days.length > 0) {
            html += `<div class="print-notes" style="font-size: 18px; margin-top: 15px;"><b>ملاحظات:</b> الأيام التي بها 7 حصص: ${days.join(" ، ")}</div>`;
        }

        return html;
    }

    async function prepareAndSavePDF() {
        const { jsPDF } = window.jspdf;
        
        // إنشاء نسخة للطباعة
        let printHTML = generatePrintTable();
        
        // إنشاء عنصر مؤقت للطباعة
        let printContainer = document.getElementById("printContainer");
        printContainer.style.display = "block";
        printContainer.innerHTML = printHTML;
        
        // إضافة عنوان
        let title = document.createElement("h2");
        title.style.textAlign = "center";
        title.style.fontSize = "28px";
        title.style.marginBottom = "20px";
        title.style.fontWeight = "bold";
        title.innerText = "جدول الحصص - مدرسة شبراخيث الثانوية بنات";
        printContainer.insertBefore(title, printContainer.firstChild);
        
        // التقاط الصورة
        let canvas = await html2canvas(printContainer, {
            scale: 2,
            backgroundColor: '#ffffff'
        });
        
        let img = canvas.toDataURL("image/png");
        let pdf = new jsPDF("p", "mm", "a4");
        let width = 190;
        let height = (canvas.height * width) / canvas.width;
        pdf.addImage(img, "PNG", 10, 10, width, height);
        pdf.save("school_schedule_print.pdf");
        
        // إخفاء العنصر مرة أخرى
        printContainer.style.display = "none";
        printContainer.innerHTML = "";
    }
</script>
