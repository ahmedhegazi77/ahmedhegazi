    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; text-align: center; padding: 40px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 450px; margin: auto; border-top: 6px solid #2c3e50; }

        /* تكبير منطقة النتيجة للضعف */
        #res { margin-top: 20px; padding: 25px; background: #e8f5e9; border-radius: 8px; display: none; text-align: right; border-right: 8px solid #2e7d32; }
        .field { margin-bottom: 15px; font-size: 34px; } /* تم التكبير هنا */
        
        .password-text { 
            direction: ltr !important; 
            display: inline-block; 
            unicode-bidi: bidi-override;
            color: #c0392b;
            font-family: monospace;
            font-weight: bold;
            font-size: 38px; /* تم التكبير هنا */
            letter-spacing: 2px;
        }

.back{
    display:block;

    color:#d63384;
    font-weight:bold;

    function find() {
        const val = document.getElementById('codeInp').value.trim();
        const display = document.getElementById('res');
        const s = data.find(item => item.c === val);

        if (s) {
            display.style.display = "block";
            display.innerHTML = `
                <div class="field"><b>الكود:</b> <span style="color:#2c3e50">${s.c}</span></div>

            display.style.display = "block";
            display.innerHTML = "<p style='color:red; text-align:center; font-size:20px;'>❌ الكود غير موجود</p>";
