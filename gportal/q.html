        'quran': '📚 علوم قرآن',
        'science': '🔬 علوم',
        'geography': '🌍 جغرافيا',
        'history': '📜 تاريخ',
        'math': '🧮 رياضيات',
        'tech': '💻 تكنولوجيا',
        'webdev': '🌐 برمجة ويب',
        'philosophy': '🤔 فلسفة',
        'iq': '🧠 اختبار ذكاء'
    };
    
    currentCategory = categoryMap[category];
    currentQuestions = allQuestions.filter(q => q.category === currentCategory);
    
    document.getElementById('categoryNotice').innerHTML = 
        `🏆 ${currentCategory} - ${currentQuestions.length} سؤال للمتفوقين 🏆`;
    
    current = 0;
    score = 0;
    showQuestion();
}

function showQuestion() {
    const totalQuestions = currentQuestions.length;
    
    document.getElementById('questionNumber').innerHTML = 
        `📌 السؤال ${current + 1} من ${totalQuestions}`;
    document.getElementById('currentCategory').innerHTML = currentCategory;
    document.getElementById('questionText').innerText = currentQuestions[current].question;
    
    for (let i = 0; i < 3; i++) {
        const btn = document.getElementById('option' + i);
        btn.innerText = currentQuestions[current].options[i];
        btn.disabled = false;
        btn.className = 'option-btn';
    }
    
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('restartBtn').style.display = 'none';
    
    const progress = ((current + 1) / totalQuestions) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('score').innerHTML = `⭐ النتيجة: ${score} / ${totalQuestions}`;
}

function checkAnswer(selected) {
    const totalQuestions = currentQuestions.length;
    const correct = currentQuestions[current].answer;
    const correctAnswerText = currentQuestions[current].options[correct];

    for (let i = 0; i < 3; i++) {
        document.getElementById('option' + i).disabled = true;
    }

    if (selected === correct) {
        document.getElementById('option' + selected).className = 'option-btn correct';
        document.getElementById('feedback').innerHTML = '✅ إجابة صحيحة! أحسنت!';
        score++;
    } else {
        document.getElementById('option' + selected).className = 'option-btn wrong';
        document.getElementById('option' + correct).className = 'option-btn correct';
        document.getElementById('feedback').innerHTML = 
            `❌ إجابة خاطئة!<br>الإجابة الصحيحة: ${correctAnswerText}`;
    }

    document.getElementById('score').innerHTML = `⭐ النتيجة: ${score} / ${totalQuestions}`;

    // ✅ التصحيح الأهم: التأكد من ظهور زر التالي
    if (current < totalQuestions - 1) {
        document.getElementById('nextBtn').style.display = 'inline-block';
    } else {
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('restartBtn').style.display = 'inline-block';
        
        let message = '';
        if (score === totalQuestions) message = '🎉 ممتاز! درجة كاملة! أنت عبقري!';
        else if (score >= totalQuestions * 0.85) message = '🎊 رائع! أداء متميز!';
        else if (score >= totalQuestions * 0.7) message = '👍 جيد جداً!';
        else if (score >= totalQuestions * 0.5) message = '👌 جيد! يمكنك التحسن';
        else message = '💪 حاول مرة أخرى!';
        
        document.getElementById('feedback').innerHTML += `<br><br>${message}`;
    }
}

function nextQuestion() {
    // ✅ تأكد من أن current يزيد بشكل صحيح
    if (current < currentQuestions.length - 1) {
        current++;
        showQuestion();
    }
}

function restartCategory() {
    current = 0;
    score = 0;
    showQuestion();
    document.getElementById('restartBtn').style.display = 'none';
}

// ✅ تأكد من إخفاء لوحة الاختبار في البداية
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('quizPanel').style.display = 'none';
});
</script>
