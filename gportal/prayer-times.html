<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>مواقيت الصلاة | شبراخيث</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Cairo', sans-serif;
        background: linear-gradient(145deg, #87CEEB 0%, #5F9EA0 50%, #4682B4 100%);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        text-align: center;
        transition: 0.4s;
    }

    /* ===== خلفية متحركة بجلانس فضي وذهبي ===== */
    body::before {
        content: '';
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 40%, rgba(255,215,0,0.25) 0%, transparent 30%),
                    radial-gradient(circle at 70% 60%, rgba(192,192,192,0.25) 0%, transparent 30%),
                    repeating-linear-gradient(45deg, 
                        transparent 0px, 
                        transparent 30px, 
                        rgba(255,215,0,0.1) 30px, 
                        rgba(192,192,192,0.1) 60px);
        animation: glisten 15s linear infinite;
        pointer-events: none;
        z-index: 0;
    }

    @keyframes glisten {
        0% { transform: rotate(0deg) scale(1); opacity: 0.5; }
        50% { transform: rotate(180deg) scale(1.3); opacity: 1; }
        100% { transform: rotate(360deg) scale(1); opacity: 0.5; }
    }

    body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(90deg, 
            transparent 0px, 
            transparent 20px, 
            rgba(255,215,0,0.15) 20px, 
            rgba(192,192,192,0.15) 40px);
        animation: glistenReverse 20s linear infinite;
        pointer-events: none;
        z-index: 0;
        filter: blur(2px);
    }

    @keyframes glistenReverse {
        0% { transform: translateX(0) scale(1); opacity: 0.3; }
        50% { transform: translateX(-100px) scale(1.3); opacity: 0.8; }
        100% { transform: translateX(0) scale(1); opacity: 0.3; }
    }

    /* ===== الكرة الأرضية في أعلى اليمين - بدون ألوان ===== */
    .earth-container {
        position: fixed;
        top: 30px;
        right: 30px;
        width: 120px;
        height: 120px;
        z-index: 10000;
        filter: drop-shadow(0 0 30px rgba(255,215,0,0.3));
        animation: earthFloat 6s ease-in-out infinite;
    }

    @keyframes earthFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    .earth {
        width: 100%;
        height: 100%;
        background: transparent;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(255,215,0,0.3), inset 0 0 20px rgba(255,215,0,0.2);
        border: 2px solid rgba(255,215,0,0.6);
        animation: earthRotate 12s linear infinite;
    }

    @keyframes earthRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* خط الاستواء */
    .equator {
        position: absolute;
        width: 100%;
        height: 2px;
        background: rgba(255,215,0,0.8);
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        box-shadow: 0 0 10px rgba(255,215,0,0.5);
        z-index: 2;
    }

    /* خطوط الطول المتساوية */
    .longitude-line {
        position: absolute;
        width: 2px;
        height: 100%;
        background: rgba(255,215,0,0.4);
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        box-shadow: 0 0 8px rgba(255,215,0,0.3);
    }

    /* خطوط طول إضافية متساوية */
    .longitude-line:nth-child(2) { transform: translateX(-50%) rotate(30deg); }
    .longitude-line:nth-child(3) { transform: translateX(-50%) rotate(60deg); }
    .longitude-line:nth-child(4) { transform: translateX(-50%) rotate(90deg); }
    .longitude-line:nth-child(5) { transform: translateX(-50%) rotate(120deg); }
    .longitude-line:nth-child(6) { transform: translateX(-50%) rotate(150deg); }

    /* خطوط العرض المتساوية */
    .latitude-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background: rgba(255,215,0,0.4);
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        box-shadow: 0 0 8px rgba(255,215,0,0.3);
    }

    .latitude-line:nth-child(7) { top: 25%; transform: translateY(-50%); }
    .latitude-line:nth-child(8) { top: 75%; transform: translateY(-50%); }

    /* ===== العينان في الشمال فوق ===== */
    .eyes-container {
        position: fixed;
        top: 30px;
        left: 30px;
        display: flex;
        gap: 20px;
        z-index: 10000;
        filter: drop-shadow(0 0 30px #ffd700);
        animation: eyesFloat 3s infinite alternate;
        pointer-events: none;
    }

    @keyframes eyesFloat {
        0% { transform: translateY(0); }
        100% { transform: translateY(-5px); }
    }

    .eye {
        position: relative;
        width: 60px;
        height: 60px;
        background: white;
        border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
        border: 4px solid #ffd700;
        overflow: hidden;
        box-shadow: 0 0 30px #ffd700, 0 0 60px #c0c0c0;
        transition: all 0.3s;
    }

    .eyeball {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f0f0f0;
        border-radius: inherit;
    }

    .pupil {
        position: absolute;
        width: 25px;
        height: 25px;
        background: radial-gradient(circle at 30% 30%, #c0c0c0, #ffd700);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: transform 0.1s;
        box-shadow: 0 0 20px #ffd700;
        border: 2px solid white;
    }

    .pupil::after {
        content: '';
        position: absolute;
        top: 6px;
        left: 6px;
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
        opacity: 0.9;
        box-shadow: 0 0 10px white;
    }

    /* تأثير النقر المتوسع */
    .ripple-effect {
        position: fixed;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,215,0,0.8), rgba(192,192,192,0.8));
        pointer-events: none;
        z-index: 9999;
        animation: ripple 0.6s ease-out forwards;
    }

    @keyframes ripple {
        0% { width: 0; height: 0; opacity: 0.8; }
        100% { width: 500px; height: 500px; opacity: 0; transform: translate(-50%, -50%) scale(2); }
    }

    /* جزيئات ضوئية */
    .light-particle {
        position: fixed;
        width: 6px;
        height: 6px;
        background: radial-gradient(circle, #ffd700, #c0c0c0);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        animation: particleFloat 1.5s forwards;
        box-shadow: 0 0 20px #ffd700;
    }

    @keyframes particleFloat {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(4) translateY(-80px); opacity: 0; }
    }

    .header {
        background: linear-gradient(145deg, #c0c0c0, #a0a0a0);
        color: #2c3e50;
        padding: 40px 20px;
        border-radius: 0 0 60px 60px;
        margin-bottom: 20px;
        position: relative;
        z-index: 10;
        border-bottom: 4px solid #ffd700;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .school-name {
        font-size: 24px;
        font-weight: bold;
        color: #2c3e50;
        text-shadow: 2px 2px 4px rgba(255,215,0,0.3);
    }

    .title {
        font-size: 38px;
        font-weight: 800;
        color: #2c3e50;
        text-shadow: 2px 2px 4px rgba(255,215,0,0.3);
        font-family: 'Amiri', serif;
        margin-top: 10px;
    }

    .date-box {
        margin: 20px;
        font-size: 22px;
        color: #2c3e50;
        background: rgba(255,255,255,0.2);
        backdrop-filter: blur(5px);
        padding: 15px 30px;
        border-radius: 60px;
        display: inline-block;
        border: 2px solid #ffd700;
        position: relative;
        z-index: 10;
    }

    .ramadan-day {
        margin: 10px;
        font-size: 20px;
        color: #2c3e50;
        background: rgba(255,215,0,0.2);
        backdrop-filter: blur(5px);
        padding: 10px 25px;
        border-radius: 60px;
        display: inline-block;
        border: 2px solid #ffd700;
        position: relative;
        z-index: 10;
        font-weight: bold;
    }

    .countdown {
        font-size: 24px;
        margin: 20px;
        color: #2c3e50;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(255,215,0,0.3);
        background: rgba(255,255,255,0.2);
        backdrop-filter: blur(5px);
        padding: 20px 30px;
        border-radius: 60px;
        display: inline-block;
        border: 3px solid #ffd700;
        position: relative;
        z-index: 10;
    }

    .special-times {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        margin: 20px;
        position: relative;
        z-index: 10;
    }

    .special-card {
        background: linear-gradient(145deg, #c0c0c0, #a0a0a0);
        color: #2c3e50;
        min-width: 180px;
        padding: 15px 20px;
        border-radius: 50px;
        border: 3px solid #ffd700;
        box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
        border-style: dashed;
    }

    .special-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 200%;
        height: 100%;
        background: linear-gradient(120deg, 
            transparent 0%, 
            transparent 30%, 
            rgba(255, 215, 0, 0.15) 45%,
            rgba(255, 255, 255, 0.3) 50%,
            rgba(255, 215, 0, 0.15) 55%,
            transparent 70%,
            transparent 100%);
        transform: skewX(-20deg);
        animation: shine 8s infinite;
        pointer-events: none;
    }

    .special-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(255,215,0,0.3);
    }

    .special-name {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 16px;
        color: #6b4f3a;
    }

    .special-time {
        font-size: 22px;
        font-weight: 800;
        color: #2c3e50;
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
        max-width: 1000px;
        margin: 0 auto;
        position: relative;
        z-index: 10;
    }

    .card {
        background: linear-gradient(145deg, #c0c0c0, #a0a0a0);
        color: #2c3e50;
        width: 160px;
        padding: 20px 15px;
        border-radius: 50px;
        border: 3px solid #ffd700;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
    }

    .card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 200%;
        height: 100%;
        background: linear-gradient(120deg, 
            transparent 0%, 
            transparent 30%, 
            rgba(255, 215, 0, 0.2) 45%,
            rgba(255, 255, 255, 0.4) 50%,
            rgba(255, 215, 0, 0.2) 55%,
            transparent 70%,
            transparent 100%);
        transform: skewX(-20deg);
        animation: shine 6s infinite;
        pointer-events: none;
    }

    @keyframes shine {
        0% { left: -150%; }
        100% { left: 150%; }
    }

    .card.active {
        background: linear-gradient(145deg, #ffd700, #c0c0c0);
        transform: scale(1.05);
        border-color: white;
        box-shadow: 0 15px 30px rgba(255,215,0,0.4);
    }

    .prayer-name {
        font-weight: bold;
        margin-bottom: 10px;
        font-size: 20px;
        color: #2c3e50;
    }

    .prayer-time {
        font-size: 18px;
        color: #2c3e50;
        background: rgba(255,255,255,0.3);
        padding: 8px;
        border-radius: 40px;
        backdrop-filter: blur(5px);
    }

    button {
        margin: 20px;
        padding: 15px 40px;
        border: 3px solid white;
        border-radius: 60px;
        background: linear-gradient(145deg, #ffd700, #c0c0c0);
        color: #2c3e50;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        transition: all 0.3s;
        box-shadow: 0 5px 15px rgba(255,215,0,0.3);
        position: relative;
        z-index: 10;
    }

    button:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 8px 25px rgba(255,215,0,0.5);
    }

    button:active {
        animation: clickRipple 0.4s ease-out;
    }

    .footer-note {
        margin: 30px;
        font-size: 16px;
        color: #2c3e50;
        background: rgba(255,255,255,0.2);
        backdrop-filter: blur(5px);
        padding: 15px 30px;
        border-radius: 60px;
        display: inline-block;
        border: 2px solid #ffd700;
        position: relative;
        z-index: 10;
    }

    .stars {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 1;
        pointer-events: none;
    }

    .star {
        position: absolute;
        width: 3px;
        height: 3px;
        background: rgba(255,215,0,0.3);
        border-radius: 50%;
        animation: twinkle 4s infinite alternate;
    }

    @keyframes twinkle {
        from { opacity: 0.2; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1.2); background: #ffd700; }
    }

    @media (max-width: 768px) {
        .title { font-size: 28px; }
        .earth-container { width: 90px; height: 90px; top: 15px; right: 15px; }
        .eyes-container { left: 15px; }
        .eye { width: 50px; height: 50px; }
        .card { width: 140px; }
        .special-times { flex-direction: column; align-items: center; }
        .special-card { width: 90%; }
    }
</style>
</head>
<body>

<!-- الكرة الأرضية في أعلى اليمين - بدون ألوان -->
<div class="earth-container">
    <div class="earth">
        <!-- خط الاستواء -->
        <div class="equator"></div>
        <!-- خطوط طول متساوية (6 خطوط) -->
        <div class="longitude-line"></div>
        <div class="longitude-line"></div>
        <div class="longitude-line"></div>
        <div class="longitude-line"></div>
        <div class="longitude-line"></div>
        <div class="longitude-line"></div>
        <!-- خطوط عرض (علوي وسفلي) -->
        <div class="latitude-line"></div>
        <div class="latitude-line"></div>
    </div>
</div>

<!-- العيون في الشمال فوق -->
<div class="eyes-container">
    <div class="eye eye-left">
        <div class="eyeball">
            <div class="pupil" id="leftPupil"></div>
        </div>
    </div>
    <div class="eye eye-right">
        <div class="eyeball">
            <div class="pupil" id="rightPupil"></div>
        </div>
    </div>
</div>

<div class="stars" id="stars"></div>

<div class="header">
    <div class="school-name">🕌 بوابة مدرسة شبراخيث الثانوية بنات</div>
    <div class="title">مواقيت الصلاة اليوم</div>
</div>

<div class="date-box" id="dateBox"></div>
<div class="ramadan-day" id="ramadanDay"></div>
<div class="countdown" id="countdown"></div>

<!-- الأوقات الخاصة -->
<div class="special-times" id="specialTimes"></div>

<div class="container" id="prayerContainer"></div>

<button onclick="window.location.href='secschool.html'; createRipple(event)">⬅️ العودة للبوابة</button>

<div class="footer-note">
    ﴿ إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا ﴾
</div>

<audio id="adhanAudio"></audio>

<script>
    const city = "Shubrakhit";
    const country = "Egypt";

    let prayersList = [];
    let nextPrayer = null;

    // ===== العيون تتبع الماوس =====
    const leftPupil = document.querySelector('.eye-left .pupil');
    const rightPupil = document.querySelector('.eye-right .pupil');
    const pupils = [leftPupil, rightPupil];

    document.addEventListener('mousemove', function(e) {
        pupils.forEach(pupil => {
            const eye = pupil.closest('.eye');
            const eyeRect = eye.getBoundingClientRect();
            const eyeCenterX = eyeRect.left + eyeRect.width / 2;
            const eyeCenterY = eyeRect.top + eyeRect.height / 2;
            
            const deltaX = e.clientX - eyeCenterX;
            const deltaY = e.clientY - eyeCenterY;
            
            const angle = Math.atan2(deltaY, deltaX);
            const distance = Math.min(10, Math.sqrt(deltaX * deltaX + deltaY * deltaY) / 15);
            
            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;
            
            pupil.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
        });
    });

    // ===== تأثير النقر المتوسع =====
    function createRipple(event) {
        if (!event) return;
        
        const ripple = document.createElement('div');
        ripple.className = 'ripple-effect';
        
        const x = event.clientX;
        const y = event.clientY;
        
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.style.transform = 'translate(-50%, -50%)';
        
        document.body.appendChild(ripple);
        
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                createLightParticle(x, y);
            }, i * 50);
        }
        
        setTimeout(() => {
            ripple.remove();
        }, 600);
    }

    function createLightParticle(x, y) {
        const particle = document.createElement('div');
        particle.className = 'light-particle';
        particle.style.left = (x || window.innerWidth/2) + (Math.random() - 0.5) * 100 + 'px';
        particle.style.top = (y || window.innerHeight/2) + (Math.random() - 0.5) * 100 + 'px';
        document.body.appendChild(particle);
        
        setTimeout(() => {
            particle.remove();
        }, 1500);
    }

    document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.95) {
            createLightParticle(e.clientX, e.clientY);
        }
    });

    // دالة تحويل الوقت إلى صيغة 12 ساعة
    function convertTo12HourFormat(time24) {
        const [hours, minutes] = time24.split(':');
        const hour = parseInt(hours);
        const ampm = hour >= 12 ? 'م' : 'ص';
        const hour12 = hour % 12 || 12;
        return `${hour12}:${minutes} ${ampm}`;
    }

    // دالة حساب الأوقات الخاصة
    function calculateSpecialTimes(fajr, maghrib, isha) {
        // تحويل الأوقات إلى ثواني
        const fajrSeconds = timeToSeconds(fajr);
        const maghribSeconds = timeToSeconds(maghrib);
        const ishaSeconds = timeToSeconds(isha);
        
        // حساب منتصف الليل (نصف الوقت بين المغرب والفجر)
        let midnightSeconds;
        if (maghribSeconds > fajrSeconds) {
            // حالة طبيعية: المغرب بعد العصر
            midnightSeconds = maghribSeconds + ((86400 - maghribSeconds + fajrSeconds) / 2);
        } else {
            // حالة استثنائية
            midnightSeconds = maghribSeconds + ((fajrSeconds - maghribSeconds) / 2);
        }
        
        // تصحيح إذا تعدى 24 ساعة
        if (midnightSeconds >= 86400) {
            midnightSeconds -= 86400;
        }
        
        // حساب ثلث الليل الأول
        let firstThirdSeconds;
        if (maghribSeconds > fajrSeconds) {
            firstThirdSeconds = maghribSeconds + ((86400 - maghribSeconds + fajrSeconds) / 3);
        } else {
            firstThirdSeconds = maghribSeconds + ((fajrSeconds - maghribSeconds) / 3);
        }
        
        if (firstThirdSeconds >= 86400) {
            firstThirdSeconds -= 86400;
        }
        
        // حساب وقت الشروق بعد الفجر
        const afterFajrSeconds = fajrSeconds + 1800; // 30 دقيقة بعد الفجر
        let afterFajrTime;
        if (afterFajrSeconds >= 86400) {
            afterFajrTime = secondsToTime(afterFajrSeconds - 86400);
        } else {
            afterFajrTime = secondsToTime(afterFajrSeconds);
        }
        
        return {
            midnight: secondsToTime(midnightSeconds),
            firstThird: secondsToTime(firstThirdSeconds),
            afterFajr: afterFajrTime
        };
    }

    // دالة تحويل الثواني إلى وقت
    function secondsToTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    }

    function timeToSeconds(t) {
        const timePart = t.split(' ')[0];
        const parts = timePart.split(":");
        return (parseInt(parts[0]) * 3600) + (parseInt(parts[1]) * 60);
    }

    async function loadPrayerTimes() {
        try {
            const response = await fetch(
                `https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=5`
            );
            const data = await response.json();
            const timings = data.data.timings;
            const hijri = data.data.date.hijri;

            // عرض التاريخ مع اليوم
            document.getElementById("dateBox").innerHTML = 
                `${data.data.date.gregorian.weekday.ar} - ${data.data.date.gregorian.date}`;

            // عرض عدد اليوم من رمضان
            const ramadanDay = hijri.day;
            document.getElementById("ramadanDay").innerHTML = 
                `🌙 اليوم ${ramadanDay} من شهر رمضان المبارك`;

            prayersList = [
                { name: "الفجر", time: timings.Fajr },
                { name: "الشروق", time: timings.Sunrise },
                { name: "الظهر", time: timings.Dhuhr },
                { name: "العصر", time: timings.Asr },
                { name: "المغرب", time: timings.Maghrib },
                { name: "العشاء", time: timings.Isha }
            ];

            // حساب الأوقات الخاصة
            const special = calculateSpecialTimes(timings.Fajr, timings.Maghrib, timings.Isha);
            
            // عرض الأوقات الخاصة
            const specialContainer = document.getElementById("specialTimes");
            specialContainer.innerHTML = `
                <div class="special-card">
                    <div class="special-name">🌙 ثلث الليل الأول</div>
                    <div class="special-time">${convertTo12HourFormat(special.firstThird)}</div>
                </div>
                <div class="special-card">
                    <div class="special-name">⭐ منتصف الليل</div>
                    <div class="special-time">${convertTo12HourFormat(special.midnight)}</div>
                </div>
                <div class="special-card">
                    <div class="special-name">☀️ بعد الفجر بـ ٣٠ دقيقة</div>
                    <div class="special-time">${convertTo12HourFormat(special.afterFajr)}</div>
                </div>
            `;

            renderCards();
            calculateNextPrayer();
            startCountdown();
        } catch (error) {
            console.error("حدث خطأ في تحميل مواقيت الصلاة:", error);
        }
    }

    function renderCards() {
        const container = document.getElementById("prayerContainer");
        container.innerHTML = "";
        const nowSeconds = currentTimeSeconds();

        prayersList.forEach(p => {
            const prayerSeconds = timeToSeconds(p.time);
            const card = document.createElement("div");
            card.className = "card";

            if (nowSeconds >= prayerSeconds && isCurrentPrayer(p)) {
                card.classList.add("active");
            }

            const time12h = convertTo12HourFormat(p.time);

            card.innerHTML = `
                <div class="prayer-name">${p.name}</div>
                <div class="prayer-time">${time12h}</div>
            `;

            container.appendChild(card);
        });
    }

    function currentTimeSeconds() {
        const now = new Date();
        return (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
    }

    function calculateNextPrayer() {
        const now = currentTimeSeconds();
        nextPrayer = null;

        for (let i = 0; i < prayersList.length; i++) {
            const prayerSeconds = timeToSeconds(prayersList[i].time);
            if (prayerSeconds > now) {
                nextPrayer = { ...prayersList[i], seconds: prayerSeconds };
                return;
            }
        }

        nextPrayer = {
            ...prayersList[0],
            seconds: timeToSeconds(prayersList[0].time) + 86400
        };
    }

    function isCurrentPrayer(prayer) {
        const now = currentTimeSeconds();
        const index = prayersList.findIndex(p => p.name === prayer.name);
        const start = timeToSeconds(prayer.time);
        const end = (index < prayersList.length - 1) ? 
            timeToSeconds(prayersList[index + 1].time) : 
            timeToSeconds(prayersList[0].time) + 86400;

        return now >= start && now < end;
    }

    function startCountdown() {
        setInterval(() => {
            if (!nextPrayer) return;

            const now = currentTimeSeconds();
            let diff = nextPrayer.seconds - now;

            if (diff <= 0) {
                calculateNextPrayer();
                renderCards();
                return;
            }

            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            const s = diff % 60;

            const prayerTime12h = convertTo12HourFormat(nextPrayer.time);
            document.getElementById("countdown").innerHTML = 
                `⏳ متبقي على صلاة ${nextPrayer.name} (${prayerTime12h}): ${h} ساعة ${m} دقيقة ${s} ثانية`;

            if (diff === 600) alert(`⏰ متبقي 10 دقائق على صلاة ${nextPrayer.name}`);
            if (diff === 0) {
                alert(`🕌 حان الآن وقت صلاة ${nextPrayer.name}`);
                document.getElementById("adhanAudio").play().catch(e => console.log("لا يمكن تشغيل الأذان"));
            }
        }, 1000);
    }

    function createStars() {
        const stars = document.getElementById("stars");
        for (let i = 0; i < 60; i++) {
            const star = document.createElement("div");
            star.className = "star";
            star.style.top = Math.random() * 100 + "%";
            star.style.left = Math.random() * 100 + "%";
            star.style.animationDelay = Math.random() * 3 + "s";
            stars.appendChild(star);
        }
    }

    // ربط دالة createRipple مع الزر
    document.querySelector('button').addEventListener('click', function(e) {
        createRipple(e);
    });

    // جعل createRipple متاحاً عالمياً
    window.createRipple = createRipple;

    createStars();
    loadPrayerTimes();
</script>

</body>
