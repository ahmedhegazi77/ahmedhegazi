<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>إمساكية رمضان | شبراخيث</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Cairo', sans-serif;
        background: linear-gradient(145deg, #87CEEB 0%, #5F9EA0 50%, #4682B4 100%);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        text-align: center;
        transition: 0.4s;
    }

    /* ===== خلفية متحركة بجلانس فضي وذهبي ===== */
    body::before {
        content: '';
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 40%, rgba(255,215,0,0.25) 0%, transparent 30%),
                    radial-gradient(circle at 70% 60%, rgba(192,192,192,0.25) 0%, transparent 30%),
                    repeating-linear-gradient(45deg, 
                        transparent 0px, 
                        transparent 30px, 
                        rgba(255,215,0,0.1) 30px, 
                        rgba(192,192,192,0.1) 60px);
        animation: glisten 15s linear infinite;
        pointer-events: none;
        z-index: 0;
    }

    @keyframes glisten {
        0% { transform: rotate(0deg) scale(1); opacity: 0.5; }
        50% { transform: rotate(180deg) scale(1.3); opacity: 1; }
        100% { transform: rotate(360deg) scale(1); opacity: 0.5; }
    }

    body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(90deg, 
            transparent 0px, 
            transparent 20px, 
            rgba(255,215,0,0.15) 20px, 
            rgba(192,192,192,0.15) 40px);
        animation: glistenReverse 20s linear infinite;
        pointer-events: none;
        z-index: 0;
        filter: blur(2px);
    }

    @keyframes glistenReverse {
        0% { transform: translateX(0) scale(1); opacity: 0.3; }
        50% { transform: translateX(-100px) scale(1.3); opacity: 0.8; }
        100% { transform: translateX(0) scale(1); opacity: 0.3; }
    }

    /* ===== العينان في الشمال فوق (بدون موسيقى) ===== */
    .eyes-container {
        position: fixed;
        top: 20px;
        left: 20px;
        display: flex;
        gap: 20px;
        z-index: 10000;
        filter: drop-shadow(0 0 30px #ffd700);
        animation: eyesFloat 3s infinite alternate;
        pointer-events: none;
    }

    @keyframes eyesFloat {
        0% { transform: translateY(0); }
        100% { transform: translateY(-5px); }
    }

    .eye {
        position: relative;
        width: 70px;
        height: 70px;
        background: white;
        border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
        border: 4px solid #ffd700;
        overflow: hidden;
        box-shadow: 0 0 30px #ffd700, 0 0 60px #c0c0c0;
        transition: all 0.3s;
    }

    .eyeball {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f0f0f0;
        border-radius: inherit;
    }

    .pupil {
        position: absolute;
        width: 30px;
        height: 30px;
        background: radial-gradient(circle at 30% 30%, #c0c0c0, #ffd700);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: transform 0.1s;
        box-shadow: 0 0 20px #ffd700;
        border: 2px solid white;
    }

    .pupil::after {
        content: '';
        position: absolute;
        top: 8px;
        left: 8px;
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 50%;
        opacity: 0.9;
        box-shadow: 0 0 10px white;
    }

    /* تأثير النقر المتوسع */
    .ripple-effect {
        position: fixed;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,215,0,0.8), rgba(192,192,192,0.8));
        pointer-events: none;
        z-index: 9999;
        animation: ripple 0.6s ease-out forwards;
    }

    @keyframes ripple {
        0% { width: 0; height: 0; opacity: 0.8; }
        100% { width: 500px; height: 500px; opacity: 0; transform: translate(-50%, -50%) scale(2); }
    }

    /* جزيئات ضوئية */
    .light-particle {
        position: fixed;
        width: 8px;
        height: 8px;
        background: radial-gradient(circle, #ffd700, #c0c0c0);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        animation: particleFloat 1.5s forwards;
        box-shadow: 0 0 20px #ffd700;
    }

    @keyframes particleFloat {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(4) translateY(-80px); opacity: 0; }
    }

    .header {
        background: linear-gradient(145deg, #c0c0c0, #a0a0a0);
        color: #2c3e50;
        padding: 40px 20px;
        border-radius: 0 0 60px 60px;
        margin-bottom: 20px;
        position: relative;
        z-index: 10;
        border-bottom: 4px solid #ffd700;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .school-name {
        font-size: 24px;
        font-weight: bold;
        color: #2c3e50;
        text-shadow: 2px 2px 4px rgba(255,215,0,0.3);
    }

    .title {
        font-size: 42px;
        font-weight: 800;
        color: #2c3e50;
        text-shadow: 2px 2px 4px rgba(255,215,0,0.3);
        font-family: 'Amiri', serif;
        margin-top: 10px;
    }

    .countdown {
        font-size: 26px;
        margin: 20px;
        color: #2c3e50;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(255,215,0,0.3);
        background: rgba(255,255,255,0.2);
        backdrop-filter: blur(5px);
        padding: 20px;
        border-radius: 60px;
        display: inline-block;
        border: 3px solid #ffd700;
        position: relative;
        z-index: 10;
    }

    .controls {
        margin: 20px;
        position: relative;
        z-index: 10;
    }

    button {
        padding: 12px 30px;
        border: 3px solid white;
        border-radius: 60px;
        margin: 5px;
        cursor: pointer;
        background: linear-gradient(145deg, #ffd700, #c0c0c0);
        color: #2c3e50;
        font-weight: bold;
        font-size: 18px;
        transition: all 0.3s;
        box-shadow: 0 5px 15px rgba(255,215,0,0.3);
        font-family: 'Cairo', sans-serif;
    }

    button:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 8px 25px rgba(255,215,0,0.5);
    }

    button:active {
        animation: clickRipple 0.4s ease-out;
    }

    .table-container {
        padding: 20px;
        overflow-x: auto;
        position: relative;
        z-index: 10;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: linear-gradient(145deg, #c0c0c0, #a0a0a0);
        color: #2c3e50;
        border-radius: 30px;
        overflow: hidden;
        border: 3px solid #ffd700;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    th, td {
        padding: 12px 8px;
        border-bottom: 1px solid #ffd700;
        text-align: center;
        font-size: 16px;
    }

    th {
        background: linear-gradient(145deg, #ffd700, #c0c0c0);
        color: #2c3e50;
        font-weight: bold;
    }

    tr:last-child td {
        border-bottom: none;
    }

    tr.today {
        background: rgba(255, 215, 0, 0.3);
        font-weight: bold;
    }

    tr.today td {
        border: 2px solid #ffd700;
    }

    .footer {
        margin: 30px;
        font-size: 16px;
        opacity: 0.9;
        color: #2c3e50;
        background: rgba(255,255,255,0.2);
        backdrop-filter: blur(5px);
        padding: 15px;
        border-radius: 60px;
        display: inline-block;
        border: 2px solid #ffd700;
        position: relative;
        z-index: 10;
    }

    /* الهلال */
    .moon {
        position: fixed;
        top: 60px;
        right: 60px;
        width: 90px;
        height: 90px;
        background: radial-gradient(circle at 30% 30%, #ffd700, #c0c0c0);
        border-radius: 50%;
        box-shadow: -25px 0 0 0 #87CEEB;
        z-index: 5;
        animation: floatMoon 6s ease-in-out infinite;
        opacity: 0.8;
    }

    @keyframes floatMoon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    /* جسيمات ذهبية */
    .particle {
        position: fixed;
        width: 4px;
        height: 4px;
        background: #ffd700;
        border-radius: 50%;
        opacity: 0.3;
        animation: floatUp 8s linear infinite;
        z-index: 5;
        pointer-events: none;
    }

    @keyframes floatUp {
        0% { transform: translateY(100vh); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(-10vh); opacity: 0; }
    }

    @media (max-width: 768px) {
        .title { font-size: 32px; }
        .countdown { font-size: 18px; padding: 15px; }
        th, td { font-size: 14px; padding: 8px 5px; }
        .eye { width: 55px; height: 55px; }
    }
</style>
</head>

<body>

<!-- العيون في الشمال فوق (بدون موسيقى) -->
<div class="eyes-container">
    <div class="eye eye-left">
        <div class="eyeball">
            <div class="pupil" id="leftPupil"></div>
        </div>
    </div>
    <div class="eye eye-right">
        <div class="eyeball">
            <div class="pupil" id="rightPupil"></div>
        </div>
    </div>
</div>

<div class="moon"></div>

<div class="header">
    <div class="school-name">🌙 بوابة مدرسة شبراخيث الثانوية بنات</div>
    <div class="title">إمساكية شهر رمضان المبارك</div>
</div>

<div class="countdown" id="countdown"></div>

<div class="controls">
    <button onclick="window.print(); createRipple(event)">🖨️ طباعة</button>
    <button onclick="window.print(); createRipple(event)">📄 تحميل PDF</button>
    <button onclick="window.location.href='secschool.html'; createRipple(event)">⬅️ العودة للبوابة</button>
</div>

<div class="table-container">
    <table id="ramadanTable">
        <thead>
            <tr>
                <th>اليوم</th>
                <th>التاريخ الميلادي</th>
                <th>الإمساك</th>
                <th>الفجر</th>
                <th>المغرب (الإفطار)</th>
                <th>العشاء</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="footer">
    جميع المواقيت حسب التوقيت المحلي لمدينة شبراخيث - رمضان 1446 هـ
</div>

<script>
    const city = "Shubrakhit";
    const country = "Egypt";
    const arabicDays = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    let todayMaghribSeconds = 0;

    // ===== العيون تتبع الماوس =====
    const leftPupil = document.querySelector('.eye-left .pupil');
    const rightPupil = document.querySelector('.eye-right .pupil');
    const pupils = [leftPupil, rightPupil];

    document.addEventListener('mousemove', function(e) {
        pupils.forEach(pupil => {
            const eye = pupil.closest('.eye');
            const eyeRect = eye.getBoundingClientRect();
            const eyeCenterX = eyeRect.left + eyeRect.width / 2;
            const eyeCenterY = eyeRect.top + eyeRect.height / 2;
            
            const deltaX = e.clientX - eyeCenterX;
            const deltaY = e.clientY - eyeCenterY;
            
            const angle = Math.atan2(deltaY, deltaX);
            const distance = Math.min(12, Math.sqrt(deltaX * deltaX + deltaY * deltaY) / 15);
            
            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;
            
            pupil.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
        });
    });

    // ===== تأثير النقر المتوسع =====
    function createRipple(event) {
        if (!event) return;
        
        const ripple = document.createElement('div');
        ripple.className = 'ripple-effect';
        
        const x = event.clientX;
        const y = event.clientY;
        
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.style.transform = 'translate(-50%, -50%)';
        
        document.body.appendChild(ripple);
        
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                createLightParticle(x, y);
            }, i * 50);
        }
        
        setTimeout(() => {
            ripple.remove();
        }, 600);
    }

    function createLightParticle(x, y) {
        const particle = document.createElement('div');
        particle.className = 'light-particle';
        particle.style.left = (x || window.innerWidth/2) + (Math.random() - 0.5) * 100 + 'px';
        particle.style.top = (y || window.innerHeight/2) + (Math.random() - 0.5) * 100 + 'px';
        document.body.appendChild(particle);
        
        setTimeout(() => {
            particle.remove();
        }, 1500);
    }

    document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.95) {
            createLightParticle(e.clientX, e.clientY);
        }
    });

    // دالة تنسيق الوقت بصيغة 12 ساعة مع ص/م
    function formatTo12Hour(timeStr) {
        if (!timeStr) return "";
        
        let [hours, minutes] = timeStr.split(":").map(Number);
        if (isNaN(hours) || isNaN(minutes)) return timeStr;
        
        let period = hours >= 12 ? "م" : "ص";
        let hour12 = hours % 12;
        hour12 = hour12 === 0 ? 12 : hour12;
        
        return `${hour12}:${minutes.toString().padStart(2, '0')} ${period}`;
    }

    async function loadRamadan() {
        try {
            const response = await fetch(
                `https://api.aladhan.com/v1/hijriCalendarByCity?city=${city}&country=${country}&method=5&month=9`
            );
            const data = await response.json();
            const days = data.data;
            const tbody = document.querySelector("#ramadanTable tbody");
            tbody.innerHTML = "";
            const today = new Date();

            days.forEach((day, index) => {
                const gParts = day.date.gregorian.date.split("-");
                const formatted = `${gParts[0]}/${gParts[1]}/${gParts[2]}`;

                const jsDate = new Date(day.date.gregorian.date.split("-").reverse().join("-"));
                const dayName = arabicDays[jsDate.getDay()];
                const row = document.createElement("tr");

                if (jsDate.toDateString() === today.toDateString()) {
                    row.classList.add("today");
                    const maghrib = day.timings.Maghrib.split(" ")[0].split(":");
                    todayMaghribSeconds = (parseInt(maghrib[0]) * 3600) + (parseInt(maghrib[1]) * 60);
                }

                // تنسيق الأوقات بصيغة 12 ساعة
                const imsak = formatTo12Hour(day.timings.Imsak.split(" ")[0]);
                const fajr = formatTo12Hour(day.timings.Fajr.split(" ")[0]);
                const maghrib = formatTo12Hour(day.timings.Maghrib.split(" ")[0]);
                const isha = formatTo12Hour(day.timings.Isha.split(" ")[0]);

                row.innerHTML = `
                    <td>${dayName}<br><small>اليوم ${index + 1}</small></td>
                    <td>${formatted}</td>
                    <td>${imsak}</td>
                    <td>${fajr}</td>
                    <td>${maghrib}</td>
                    <td>${isha}</td>
                `;

                tbody.appendChild(row);
            });

            startCountdown();
        } catch (error) {
            console.error("حدث خطأ في تحميل الإمساكية:", error);
            document.querySelector("#ramadanTable tbody").innerHTML = `
                <tr><td colspan="6" style="padding: 30px; color: #f44336;">
                    ❌ حدث خطأ في تحميل الإمساكية. يرجى المحاولة لاحقاً.
                </td></tr>
            `;
        }
    }

    function startCountdown() {
        setInterval(() => {
            const now = new Date();
            const currentSeconds = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds();
            let diff = todayMaghribSeconds - currentSeconds;
            
            if (diff < 0) diff += 86400;

            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            const s = diff % 60;

            document.getElementById("countdown").innerHTML = 
                `🌙 متبقي على الإفطار اليوم: ${h} ساعة ${m} دقيقة ${s} ثانية`;

            if (diff === 600) { // 10 دقائق
                alert("⏰ متبقي 10 دقائق على الإفطار");
            }
            if (diff === 0) {
                alert("🌙 حان الآن موعد الإفطار - رمضان كريم");
            }
        }, 1000);
    }

    function createParticles() {
        for (let i = 0; i < 15; i++) {
            setTimeout(() => {
                const p = document.createElement("div");
                p.className = "particle";
                p.style.left = Math.random() * 100 + "%";
                p.style.animationDuration = (Math.random() * 5 + 5) + "s";
                p.style.animationDelay = Math.random() * 5 + "s";
                document.body.appendChild(p);
            }, i * 100);
        }
    }

    // ربط دالة createRipple مع أزرار التحكم
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function(e) {
            // منع التأثير الافتراضي للطباعة من إخفاء الـ ripple
            if (this.innerText.includes('طباعة') || this.innerText.includes('PDF')) {
                e.preventDefault();
                createRipple(e);
                setTimeout(() => window.print(), 300);
            } else {
                createRipple(e);
            }
        });
    });

    // إنشاء العناصر الإضافية
    createParticles();
    
    // جعل createRipple متاحاً عالمياً
    window.createRipple = createRipple;

    // تحميل الإمساكية
    loadRamadan();
</script>

</body>
</html>
