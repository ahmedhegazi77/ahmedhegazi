<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>A.HEGAZi · Online Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 40%, #5a5a5a, #2b2b2b 80%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية معدنية محفورة */
        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -20%;
            width: 140%; height: 140%;
            background: radial-gradient(circle at 30% 40%, rgba(192,192,192,0.15) 0%, transparent 30%),
                        radial-gradient(circle at 70% 60%, rgba(255,215,0,0.08) 0%, transparent 30%),
                        repeating-linear-gradient(45deg, 
                            transparent 0px, 
                            transparent 20px, 
                            rgba(255,255,255,0.02) 20px, 
                            rgba(255,255,255,0.02) 40px);
            animation: metalWave 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes metalWave {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, 
                transparent 0px, 
                transparent 30px, 
                rgba(255,215,0,0.02) 30px, 
                rgba(255,215,0,0.02) 60px);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== زر العودة للبوابة (أسفل اليسار) ===== */
        .portal-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #b0b0b0, #5a5a5a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            border: 3px solid #ffd700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: 0.2s;
            text-decoration: none;
        }

        .portal-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(145deg, #c0c0c0, #7a7a7a);
            box-shadow: 0 0 30px #ffd700;
        }

        .portal-btn i {
            font-size: 35px;
            color: white;
            filter: drop-shadow(0 2px 2px black);
        }

        /* ===== زر التحكم في الموسيقى (أسفل اليمين) ===== */
        .music-control-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #b0b0b0, #5a5a5a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            border: 3px solid #ffd700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: 0.2s;
        }

        .music-control-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(145deg, #c0c0c0, #7a7a7a);
            box-shadow: 0 0 30px #ffd700;
        }

        .music-control-btn i {
            font-size: 35px;
            color: white;
        }

        .music-control-btn.playing {
            background: linear-gradient(145deg, #ffd700, #b8860b);
            border-color: white;
        }

        /* ===== الاسم المحفور ===== */
        .engraved-signature {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #2a2a2a;
            text-shadow: 
                -2px -2px 2px rgba(255,255,255,0.2),
                3px 3px 5px rgba(0,0,0,0.8),
                0 0 5px #ffd700;
            background: none;
            padding: 10px 0;
            border-bottom: 2px solid rgba(255,215,0,0.3);
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 950px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 50px;
            border: 3px solid rgba(255,215,0,0.3);
            box-shadow: 0 30px 50px rgba(0,0,0,0.7), inset 0 1px 3px rgba(255,255,255,0.2);
            padding: 25px;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #ffd70033;
            margin-bottom: 20px;
        }

        .owner-name {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }

        .owner-title {
            color: #ccc;
            font-size: 13px;
        }

        .tool-info {
            background: rgba(255,215,0,0.1);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid #ffd700;
            text-align: center;
        }

        .tool-name {
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
        }

        .tool-desc {
            color: #ccc;
            font-size: 11px;
        }

        .main-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .main-title h1 {
            font-size: 42px;
            font-weight: bold;
            background: linear-gradient(145deg, #e0e0e0, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px #ffd700;
            letter-spacing: 2px;
        }

        .main-title p {
            color: #ccc;
            font-size: 16px;
        }

        .media-switcher {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 25px;
        }

        .media-btn {
            background: transparent;
            border: 2px solid #ffd70066;
            color: #ccc;
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }

        .media-btn.active {
            background: #ffd700;
            border-color: white;
            color: #1a1a1a;
        }

        .upload-area {
            background: rgba(50,50,50,0.6);
            border: 2px dashed #ffd70066;
            border-radius: 30px;
            padding: 25px 15px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: #ffd700;
            background: rgba(255,215,0,0.1);
        }

        .upload-icon {
            font-size: 40px;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .upload-text {
            font-size: 16px;
            color: #ccc;
        }

        .file-info {
            background: rgba(50,50,50,0.6);
            border-radius: 20px;
            padding: 12px;
            margin: 15px 0 20px;
            border: 2px solid #ffd70066;
        }

        .file-name {
            font-size: 18px;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 3px;
            word-break: break-all;
        }

        .file-details {
            color: #ccc;
            font-size: 13px;
        }

        .video-container {
            width: 100%;
            border-radius: 30px;
            overflow: hidden;
            background: black;
            margin: 15px 0 20px;
            border: 3px solid #ffd700;
        }

        .video-container video {
            width: 100%;
            max-height: 450px;
            display: block;
        }

        .album-art {
            width: 200px;
            height: 200px;
            margin: 15px auto 20px;
            background: linear-gradient(145deg, #3a3a3a, #1a1a1a);
            border-radius: 30px;
            border: 3px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px black;
        }

        .album-art span {
            font-size: 70px;
            filter: drop-shadow(0 0 15px gold);
        }

        .time-display {
            font-size: 28px;
            color: #ffd700;
            margin: 10px 0 15px;
            font-family: monospace;
            text-align: center;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 8px;
            margin: 15px 0;
            cursor: pointer;
            border: 1px solid #ffd70066;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #b8860b);
            border-radius: 8px;
            width: 0%;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(145deg, #6a6a6a, #3a3a3a);
            border: 2px solid #ffd700;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 10px black;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #ffd700, #b8860b);
            border-color: white;
            color: #1a1a1a;
            font-size: 30px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 200px;
            margin: 15px auto;
        }

        .volume-btn {
            font-size: 20px;
            cursor: pointer;
            color: #ffd700;
        }

        input[type=range] {
            flex: 1;
            height: 4px;
            background: #333;
            border-radius: 4px;
            -webkit-appearance: none;
            border: 1px solid #ffd70066;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #ffd700;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
        }

        .music-visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 40px;
            gap: 4px;
            margin: 15px 0 10px;
        }

        .bar {
            width: 6px;
            background: linear-gradient(180deg, #ffd700, #b8860b);
            border-radius: 3px 3px 0 0;
            animation: equalizer 1s infinite ease-in-out;
        }

        @keyframes equalizer {
            0%, 100% { height: 15px; }
            50% { height: 35px; }
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0 15px;
        }

        .info-item {
            background: rgba(50,50,50,0.6);
            padding: 10px;
            border-radius: 20px;
            border: 2px solid #ffd70066;
            text-align: center;
        }

        .info-value {
            font-size: 20px;
            color: #ffd700;
            font-weight: bold;
        }

        .info-label {
            font-size: 11px;
            color: #ccc;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0 10px;
        }

        .action-btn {
            background: linear-gradient(145deg, #6a6a6a, #3a3a3a);
            color: white;
            border: 2px solid #ffd700;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: linear-gradient(145deg, #7a7a7a, #5a5a5a);
            box-shadow: 0 0 20px #ffd700;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ffd70033;
            color: #aaa;
            font-size: 13px;
        }

        .footer span {
            color: #ffd700;
        }

        /* ===== جزيئات ضوئية ذهبية ===== */
        .light-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: particleFloat 1.5s forwards;
            box-shadow: 0 0 20px #ffd700;
        }

        @keyframes particleFloat {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(4) translateY(-80px); opacity: 0; }
        }
    </style>
</head>
<body>

<!-- أزرار ثابتة -->
<a href="tools.html" class="portal-btn" id="portalBtn">
    <i>🏠</i>
</a>

<div class="music-control-btn" id="musicControlBtn" onclick="toggleMusic()">
    <i id="musicIcon">🔊</i>
</div>

<audio id="bgMusic" loop>
    <source src="../media/music.wav" type="audio/mpeg">
</audio>

<div class="container">
    <!-- الاسم المحفور -->
    <div class="engraved-signature">ENG. AHMED HEGAZI</div>

    <div class="brand-header">
        <div>
            <div class="owner-name">ENG. AHMED HEGAZI</div>
            <div class="owner-title">مطور ومبرمج</div>
        </div>
        <div class="tool-info">
            <div class="tool-name">🎯 ONLiNE PLAYER</div>
            <div class="tool-desc">Audio/Video</div>
        </div>
    </div>

    <div class="main-title">
        <h1>© ONliNE PLAYER</h1>
        <p>video,audio player</p>
    </div>

    <div class="media-switcher">
        <button class="media-btn active" id="audioModeBtn">🎵 مشغل الصوت</button>
        <button class="media-btn" id="videoModeBtn">🎬 مشغل الفيديو</button>
    </div>

    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">اضغط لرفع ملف صوت أو فيديو</div>
    </div>
    <input type="file" id="fileInput" accept="audio/*,video/*" style="display: none;">

    <div class="file-info" id="fileInfo" style="display: none;">
        <div class="file-name" id="fileName"></div>
        <div class="file-details" id="fileDetails"></div>
    </div>

    <div class="video-container" id="videoContainer" style="display: none;">
        <video id="videoPlayer" controls></video>
    </div>

    <div class="audio-player" id="audioPlayer" style="display: block;">
        <div class="album-art">
            <span>🎵</span>
        </div>

        <div class="time-display" id="audioTimeDisplay">00:00 / 00:00</div>

        <div class="progress-container" id="audioProgressContainer">
            <div class="progress-bar" id="audioProgressBar"></div>
        </div>

        <div class="controls">
            <div class="control-btn" id="audioPrevBtn">⏪</div>
            <div class="control-btn play-btn" id="audioPlayPauseBtn">▶️</div>
            <div class="control-btn" id="audioNextBtn">⏩</div>
        </div>

        <div class="volume-control">
            <span class="volume-btn" id="audioMuteBtn">🔊</span>
            <input type="range" id="audioVolumeSlider" min="0" max="1" step="0.01" value="0.7">
        </div>

        <div class="music-visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-value" id="audioBitrate">192</div>
                <div class="info-label">kbps</div>
            </div>
            <div class="info-item">
                <div class="info-value" id="audioSampleRate">44.1</div>
                <div class="info-label">kHz</div>
            </div>
            <div class="info-item">
                <div class="info-value" id="audioFileSize">0</div>
                <div class="info-label">MB</div>
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="action-btn" onclick="window.location.href='tools.html'">⬅ العودة</button>
        <button class="action-btn" id="resetBtn">🔄 إعادة تعيين</button>
    </div>

    <div class="footer">
        <span>ONLiNE PLAYER</span> © 2026 | <span>ENG. AHMED HEGAZI</span>
    </div>
</div>

<script>
    // ===== نظام الموسيقى =====
    let music = document.getElementById('bgMusic');
    let musicBtn = document.getElementById('musicControlBtn');
    let musicIcon = document.getElementById('musicIcon');
    let isPlaying = false;

    music.load();

    function toggleMusic() {
        if (isPlaying) {
            music.pause();
            musicIcon.textContent = '🔇';
            musicBtn.classList.remove('playing');
        } else {
            music.play().then(() => {
                musicIcon.textContent = '🔊';
                musicBtn.classList.add('playing');
            }).catch(e => console.log('ممنوع تشغيل الموسيقى'));
        }
        isPlaying = !isPlaying;
        createLightParticle(event?.clientX || window.innerWidth/2, event?.clientY || window.innerHeight/2);
    }

    function playMusic() {
        if (!isPlaying) {
            music.play().then(() => {
                isPlaying = true;
                musicIcon.textContent = '🔊';
                musicBtn.classList.add('playing');
            }).catch(e => console.log('ممنوع تشغيل الموسيقى تلقائياً'));
        }
    }

    // ===== جزيئات ضوئية ذهبية =====
    function createLightParticle(x, y) {
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                const particle = document.createElement('div');
                particle.className = 'light-particle';
                particle.style.left = (x || window.innerWidth/2) + (Math.random() - 0.5) * 80 + 'px';
                particle.style.top = (y || window.innerHeight/2) + (Math.random() - 0.5) * 80 + 'px';
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 1500);
            }, i * 50);
        }
    }

    document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.95) {
            createLightParticle(e.clientX, e.clientY);
        }
    });

    window.addEventListener('load', () => {
        for (let i = 0; i < 10; i++) {
            setTimeout(() => {
                createLightParticle(Math.random() * window.innerWidth, Math.random() * window.innerHeight);
            }, i * 100);
        }
    });

    // ===== كود المشغل الأصلي =====
    const audioModeBtn = document.getElementById('audioModeBtn');
    const videoModeBtn = document.getElementById('videoModeBtn');
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileDetails = document.getElementById('fileDetails');
    const videoContainer = document.getElementById('videoContainer');
    const videoPlayer = document.getElementById('videoPlayer');
    const audioPlayerDiv = document.getElementById('audioPlayer');
    
    const audioElement = new Audio();
    const audioTimeDisplay = document.getElementById('audioTimeDisplay');
    const audioProgressContainer = document.getElementById('audioProgressContainer');
    const audioProgressBar = document.getElementById('audioProgressBar');
    const audioPlayPauseBtn = document.getElementById('audioPlayPauseBtn');
    const audioPrevBtn = document.getElementById('audioPrevBtn');
    const audioNextBtn = document.getElementById('audioNextBtn');
    const audioMuteBtn = document.getElementById('audioMuteBtn');
    const audioVolumeSlider = document.getElementById('audioVolumeSlider');
    const audioBitrate = document.getElementById('audioBitrate');
    const audioSampleRate = document.getElementById('audioSampleRate');
    const audioFileSize = document.getElementById('audioFileSize');

    let currentMode = 'audio';

    audioModeBtn.addEventListener('click', () => {
        currentMode = 'audio';
        audioModeBtn.classList.add('active');
        videoModeBtn.classList.remove('active');
        videoContainer.style.display = 'none';
        audioPlayerDiv.style.display = 'block';
        videoPlayer.pause();
    });

    videoModeBtn.addEventListener('click', () => {
        currentMode = 'video';
        videoModeBtn.classList.add('active');
        audioModeBtn.classList.remove('active');
        videoContainer.style.display = 'block';
        audioPlayerDiv.style.display = 'none';
        audioElement.pause();
        audioPlayPauseBtn.textContent = '▶️';
    });

    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        fileInfo.style.display = 'block';
        fileName.textContent = file.name;
        
        const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
        const fileType = file.type.split('/')[0];
        fileDetails.textContent = `${fileType === 'audio' ? '🎵 صوت' : '🎬 فيديو'} | ${fileSizeMB} MB`;
        audioFileSize.textContent = fileSizeMB;

        if (file.type.startsWith('audio/')) {
            currentMode = 'audio';
            audioModeBtn.click();
            audioElement.src = url;
            audioElement.load();
            audioElement.play();
            audioPlayPauseBtn.textContent = '⏸️';
            audioBitrate.textContent = '192';
            audioSampleRate.textContent = '44.1';
        } else if (file.type.startsWith('video/')) {
            currentMode = 'video';
            videoModeBtn.click();
            videoPlayer.src = url;
            videoPlayer.load();
            videoPlayer.play();
        }
    });

    audioElement.addEventListener('timeupdate', () => {
        const current = audioElement.currentTime;
        const duration = audioElement.duration || 0;
        audioProgressBar.style.width = (current / duration) * 100 + '%';
        audioTimeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
    });

    audioElement.addEventListener('loadedmetadata', () => {
        audioTimeDisplay.textContent = `00:00 / ${formatTime(audioElement.duration)}`;
    });

    audioElement.addEventListener('ended', () => {
        audioPlayPauseBtn.textContent = '▶️';
    });

    audioProgressContainer.addEventListener('click', (e) => {
        const rect = audioProgressContainer.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const percentage = clickX / rect.width;
        audioElement.currentTime = percentage * audioElement.duration;
    });

    audioPlayPauseBtn.addEventListener('click', () => {
        if (audioElement.paused) {
            audioElement.play();
            audioPlayPauseBtn.textContent = '⏸️';
        } else {
            audioElement.pause();
            audioPlayPauseBtn.textContent = '▶️';
        }
    });

    audioPrevBtn.addEventListener('click', () => {
        audioElement.currentTime = Math.max(0, audioElement.currentTime - 10);
    });

    audioNextBtn.addEventListener('click', () => {
        audioElement.currentTime = Math.min(audioElement.duration, audioElement.currentTime + 10);
    });

    audioVolumeSlider.addEventListener('input', (e) => {
        audioElement.volume = e.target.value;
        audioMuteBtn.textContent = audioElement.volume === 0 ? '🔇' : '🔊';
    });

    audioMuteBtn.addEventListener('click', () => {
        audioElement.muted = !audioElement.muted;
        audioMuteBtn.textContent = audioElement.muted ? '🔇' : '🔊';
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        audioElement.pause();
        videoPlayer.pause();
        audioElement.src = '';
        videoPlayer.src = '';
        fileInfo.style.display = 'none';
        audioPlayPauseBtn.textContent = '▶️';
        audioTimeDisplay.textContent = '00:00 / 00:00';
        audioProgressBar.style.width = '0%';
        audioBitrate.textContent = '192';
        audioSampleRate.textContent = '44.1';
        audioFileSize.textContent = '0';
    });

    function formatTime(seconds) {
        if (isNaN(seconds)) return '00:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    audioElement.addEventListener('play', () => {
        document.querySelectorAll('.bar').forEach(bar => {
            bar.style.animation = `equalizer ${0.5 + Math.random()}s infinite`;
        });
    });
</script>
</body>
</html>
