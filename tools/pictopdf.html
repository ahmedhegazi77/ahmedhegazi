<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImagoMerge Pro | Eng. Ahmed Hegazi</title>
    <script src="jspdf.umd.min.js"></script>
    <script src="sortable.min.js"></script>
    <style>
        :root { --neon-blue: #00d4ff; --dark-bg: #050a14; --card-bg: #111b2d; }
        body {
            background-color: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif;
            margin: 0; min-height: 100vh; overflow-x: hidden;
        }
        /* Top Left Branding */
        .branding {
            position: fixed; top: 20px; left: 20px; font-weight: 900;
            font-size: 1.2rem; color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px; z-index: 2000; pointer-events: none;
            border-left: 3px solid var(--neon-blue); padding-left: 10px;
        }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .header { text-align: center; margin: 20px 0; }
        .header h1 { font-size: 2.2rem; letter-spacing: 5px; margin: 0; }
        .header span { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        .config-panel {
            background: var(--card-bg); padding: 15px 30px; border-radius: 50px;
            display: flex; gap: 25px; align-items: center; margin-bottom: 25px;
            border: 1px solid rgba(0, 212, 255, 0.3); position: sticky; top: 10px; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #drop-area {
            border: 2px dashed var(--neon-blue); width: 85%; padding: 30px;
            text-align: center; border-radius: 15px; cursor: pointer;
            background: rgba(0, 212, 255, 0.03);
        }

        #preview-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px; width: 95%; padding: 30px 0;
        }
        .img-card {
            position: relative; background: var(--card-bg); padding: 8px;
            border-radius: 10px; border: 1px solid #2d3748;
        }
        .img-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 5px; }
        .img-info { font-size: 10px; color: #888; margin-top: 5px; text-align: center; }
        
        .badge {
            position: absolute; top: -10px; left: -10px; background: var(--neon-blue);
            color: #000; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px;
        }
        .delete-btn {
            position: absolute; top: -10px; right: -10px; background: #ff4757;
            color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer;
        }

        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 10, 20, 0.98); z-index: 10001;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .progress-box { width: 350px; height: 12px; background: #000; border-radius: 10px; margin-top: 20px; overflow: hidden; border: 1px solid var(--neon-blue); }
        #progress-bar { width: 0%; height: 100%; background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); transition: width 0.1s; }
        .neon-text { color: var(--neon-blue); font-size: 1.8rem; letter-spacing: 8px; text-shadow: 0 0 15px var(--neon-blue); }

        .btn { padding: 12px 25px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; }
        .btn-main { background: var(--neon-blue); color: #000; }
        .btn-main:hover { box-shadow: 0 0 20px var(--neon-blue); }
        .toggle-label { cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    </style>
</head>
<body ondblclick="goToTools(event)">

    <div class="branding">Eng. Ahmed Hegazi</div>

    <div class="container">
        <div class="header">
            <h1>IMAGOMERGE <span>PRO</span></h1>
            <p style="opacity: 0.5;">Double-click background to return</p>
        </div>

        <div class="config-panel">
            <label class="toggle-label"><input type="checkbox" id="scalingOption" checked> Auto-Scale</label>
            <label class="toggle-label"><input type="checkbox" id="landscapeOption"> Landscape Mode</label>
            <button class="btn btn-main" onclick="generatePDF()">🚀 Build PDF</button>
            <button class="btn" style="background:#222; color:#ff4757; border:1px solid #ff4757" onclick="location.reload()">Clear</button>
        </div>

        <div id="drop-area" onclick="document.getElementById('fileInput').click()">
            DROP IMAGES HERE
            <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
        </div>

        <div id="preview-container"></div>
    </div>

    <div id="loader">
        <div class="neon-text">CONSTRUCTING...</div>
        <div class="progress-box"><div id="progress-bar"></div></div>
        <p id="progress-stats" style="margin-top:15px; color: var(--neon-blue);">Ready to Launch</p>
    </div>

    <script>
        const container = document.getElementById('preview-container');
        const loader = document.getElementById('loader');
        const pBar = document.getElementById('progress-bar');
        const pStats = document.getElementById('progress-stats');

        function goToTools(e) {
            if (e.target === document.body || e.target.className === 'container') {
                window.location.href = 'tools.html';
            }
        }

        new Sortable(container, { animation: 150, onEnd: updateNumbers });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const imgObj = new Image();
                    imgObj.src = e.target.result;
                    imgObj.onload = () => {
                        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                        const div = document.createElement('div');
                        div.className = 'img-card';
                        div.innerHTML = `
                            <div class="badge"></div>
                            <button class="delete-btn" onclick="this.parentElement.remove(); updateNumbers();">X</button>
                            <img src="${e.target.result}" class="sort-img">
                            <div class="img-info">${imgObj.width}x${imgObj.height} px | ${sizeMB} MB</div>
                        `;
                        container.appendChild(div);
                        updateNumbers();
                    };
                };
                reader.readAsDataURL(file);
            });
        }

        function updateNumbers() {
            document.querySelectorAll('.badge').forEach((b, i) => b.innerText = i + 1);
        }

        async function generatePDF() {
            const images = document.querySelectorAll('.sort-img');
            if (images.length === 0) return;

            const isLandscape = document.getElementById('landscapeOption').checked;
            const doScale = document.getElementById('scalingOption').checked;
            
            loader.style.display = 'flex';
            const { jsPDF } = window.jspdf;
            
            // PDF Initialization with Orientation
            const doc = new jsPDF({
                orientation: isLandscape ? 'l' : 'p',
                unit: 'mm',
                format: 'a4'
            });

            for (let i = 0; i < images.length; i++) {
                pBar.style.width = Math.round(((i + 1) / images.length) * 100) + '%';
                pStats.innerText = `Processing: ${i + 1} / ${images.length}`;

                const img = images[i];
                const imgProps = doc.getImageProperties(img.src);
                const pdfW = doc.internal.pageSize.getWidth();
                const pdfH = doc.internal.pageSize.getHeight();
                
                let finalW = imgProps.width * 0.264; 
                let finalH = imgProps.height * 0.264;

                if (doScale) {
                    finalW = pdfW;
                    finalH = (imgProps.height * pdfW) / imgProps.width;
                    // If image height exceeds page height after scaling
                    if (finalH > pdfH) {
                        finalH = pdfH;
                        finalW = (imgProps.width * pdfH) / imgProps.height;
                    }
                }

                if (i > 0) doc.addPage();
                doc.addImage(img.src, 'JPEG', 0, 0, finalW, finalH, undefined, 'FAST');
                
                if (i % 5 === 0) await new Promise(r => setTimeout(r, 20));
            }

            doc.save(`Hegazi_Export_${isLandscape ? 'Landscape' : 'Portrait'}.pdf`);
            loader.style.display = 'none';
        }
    </script>
</body>
</html>
