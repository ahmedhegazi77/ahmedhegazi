<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>EmojiForge | Engineer Ahmed Hegazi</title>
    <style>
        /* ============================================
           GLOBAL RESET & DARK PREMIUM THEME
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0c1122, #02050c);
            font-family: 'Segoe UI', 'Inter', 'Poppins', system-ui, -apple-system, 'Roboto', sans-serif;
            padding: 2rem 1.5rem 4rem;
            min-height: 100vh;
            color: #eef5ff;
        }

        /* main container */
        .em-master {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ========== GOLDEN PULSE MUSIC BAR (top center) ========== */
        .music-zenith {
            position: fixed;
            top: 12px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 2000;
            pointer-events: none;
        }

        .gold-pulse-bar {
            pointer-events: auto;
            width: 260px;
            height: 6px;
            background: linear-gradient(90deg, #b5b5b5, #e8e8e8, #b0b0b0);
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.6);
            position: relative;
            overflow: hidden;
        }

        .gold-pulse-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.65), transparent);
            transition: left 0.45s ease;
        }

        /* active glowing golden state */
        .gold-pulse-bar.active-music {
            background: linear-gradient(90deg, #e6b800, #ffd966, #e6b800);
            box-shadow: 0 0 14px rgba(255, 200, 0, 0.8);
            height: 7px;
        }

        .gold-pulse-bar.active-music::before {
            left: 100%;
            transition: left 0.7s ease-in-out;
        }

        /* pulse keyframes for extra shimmer */
        @keyframes gentleGoldPulse {
            0% { opacity: 0.7; box-shadow: 0 0 0 0 rgba(255,215,0,0.4);}
            100% { opacity: 1; box-shadow: 0 0 0 10px rgba(255,215,0,0);}
        }
        .gold-pulse-bar.active-music {
            animation: gentleGoldPulse 1.2s infinite;
        }

        /* ========== HEADER (ENGLISH ONLY) ========== */
        .eng-header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 35px;
        }
        .eng-header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFE6B3, #FFB347, #FFD966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .eng-header .sub {
            font-size: 0.85rem;
            font-weight: 500;
            color: #bbc8e6;
            border-top: 1px dashed rgba(255,200,100,0.4);
            display: inline-block;
            padding-top: 8px;
            margin-top: 6px;
        }

        /* ========== CATEGORY STYLING (MODERN SQUARE CARDS) ========== */
        .emoji-category {
            margin-bottom: 2.5rem;
            background: rgba(12, 18, 28, 0.5);
            backdrop-filter: blur(6px);
            border-radius: 2rem;
            padding: 1.2rem 1rem;
            transition: 0.2s;
            border: 1px solid rgba(255,200,80,0.2);
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            padding-right: 1rem;
            border-right: 5px solid #ffbc6e;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffe3b3;
        }

        /* SQUARE BUTTON GRID - perfect square cards */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 105px));
            gap: 0.9rem;
            justify-content: center;
        }

        /* SQUARE BUTTON / CARD - pure emoji, no text, hover chic + strong white flash on click */
        .emoji-sq-btn {
            background: rgba(30, 40, 55, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            aspect-ratio: 1 / 1;   /* perfect square */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            border: 1px solid rgba(255, 200, 100, 0.45);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.3);
            will-change: transform;
        }

        /* Hover effect: chic lift + subtle inner glow */
        .emoji-sq-btn:hover {
            transform: translateY(-6px) scale(1.02);
            background: rgba(70, 100, 130, 0.95);
            border-color: #ffdd99;
            box-shadow: 0 16px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,200,0.4);
        }

        /* STRONG WHITE FLASH on click (copy effect) */
        .emoji-sq-btn.flash-white {
            background: radial-gradient(circle, #ffffff, #fff5dd);
            transform: scale(0.92);
            border-color: #ffffff;
            transition: 0.045s linear;
            box-shadow: 0 0 22px rgba(255, 255, 200, 0.9);
        }

        .big-emoji {
            font-size: 2.8rem;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));
            transition: 0.05s;
        }

        /* responsive */
        @media (max-width: 680px) {
            .emoji-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 88px));
                gap: 0.7rem;
            }
            .big-emoji {
                font-size: 2.3rem;
            }
            .eng-header h1 {
                font-size: 1.8rem;
            }
        }

        /* footer toast */
        .toast-copy {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1e2cdd;
            backdrop-filter: blur(20px);
            color: #FFE8C5;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 1300;
            pointer-events: none;
            transition: 0.12s;
            border-right: 4px solid #ffbc6e;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .footer-note {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #8a99bb;
            background: rgba(0,0,0,0.3);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding: 6px 20px;
            border-radius: 50px;
        }
    </style>

    // ============================================================
    // 1. MUSIC & CLICK SOUNDS (using ../media/ files)
    //    - bg music: jmj.wav  | click fx: click.wav
    //    - gold bar toggles, with pulse animation
    // ============================================================
    let bgAudio = null;
    let isMusicActive = false;
    const goldBar = document.getElementById('goldMusicBar');

    // click sound effect
    let clickFx = null;

    // initialize audio objects (without auto-play)
    function initAudioEngine() {
        if (!bgAudio) {
            bgAudio = new Audio('../media/jmj.wav');
            bgAudio.loop = true;
            bgAudio.preload = 'auto';
            bgAudio.volume = 0.38;
        }
        if (!clickFx) {
            clickFx = new Audio('../media/click.wav');
            clickFx.preload = 'auto';
            clickFx.volume = 0.5;
        }
    }

    // play click sound (pure internal code, no external dependency)
    function playClickSound() {
        if (!clickFx) {
            clickFx = new Audio('../media/click.wav');
            clickFx.volume = 0.5;
            clickFx.preload = 'auto';
        }
        // reset & play
        clickFx.currentTime = 0;
        clickFx.play().catch(e => console.log("click sound needs first interaction"));
    }

    // background music control
    function startMusic() {
        if (!bgAudio) {
            bgAudio = new Audio('../media/jmj.wav');
            bgAudio.loop = true;
            bgAudio.volume = 0.38;
        }
        bgAudio.play().then(() => {
            isMusicActive = true;
            goldBar.classList.add('active-music');
        }).catch(err => {
            console.log("music autoplay blocked, user will activate via bar");
            isMusicActive = false;
            goldBar.classList.remove('active-music');
        });
    }

    function stopMusic() {
        if (bgAudio) {
            bgAudio.pause();
            bgAudio.currentTime = 0;
        }
        isMusicActive = false;
        goldBar.classList.remove('active-music');
    }

    function toggleMusicFromBar() {
        if (isMusicActive) {
            stopMusic();
        } else {
            startMusic();
        }
    }

    // gold bar event
    goldBar.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMusicFromBar();
    });

    // prime audio on first user interaction (to enable both music & click)
    function primeAudioOnFirstTouch() {
        initAudioEngine();
        // try to play tiny silent dummy to unlock audio context
        if (clickFx) {
            clickFx.play().then(() => {
                clickFx.pause();
                clickFx.currentTime = 0;
            }).catch(()=>{});
        }
        if (bgAudio) {
            bgAudio.play().then(() => {
                bgAudio.pause();
                bgAudio.currentTime = 0;
            }).catch(()=>{});
        }
        document.body.removeEventListener('touchstart', primeAudioOnFirstTouch);
        document.body.removeEventListener('click', primeAudioOnFirstTouch);
    }
    document.body.addEventListener('touchstart', primeAudioOnFirstTouch, { once: true });
    document.body.addEventListener('click', primeAudioOnFirstTouch, { once: true });

    // helper to copy any emoji to clipboard + strong white flash + sound
    function copyEmojiToClipboard(emojiChar, cardElement) {
        // 1) add strong white flash effect (very fast)
        if (cardElement) {
            cardElement.classList.add('flash-white');
            setTimeout(() => {
                cardElement.classList.remove('flash-white');
            }, 110);
        }
        // 2) play click sound (if music allowed or even without music, but we respect user preference)
        //    However: client expects click sound on every tap, independent from music.
        //    So we always play click sound (internal wav). Perfect.
        playClickSound();

        // 3) copy to clipboard
        navigator.clipboard.writeText(emojiChar).then(() => {
            showToast(`✨ ${emojiChar} copied! ✨`);
        }).catch(() => {
            // fallback method
            const textarea = document.createElement('textarea');
            textarea.value = emojiChar;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast(`📋 ${emojiChar} copied (fallback)`);
        });
    }

    // toast message
    let toastTimer = null;
    function showToast(msg) {
        const toast = document.getElementById('copyToastMsg');
        if (!toast) return;
        toast.textContent = msg;
        toast.style.visibility = 'visible';
        toast.style.opacity = '1';
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.visibility = 'hidden';
        }, 1300);
    }

    // ============================================================
    // 3. DYNAMIC RENDER: build all categories with SQUARE buttons
    //    Each square button has hover chic, strong white flash on click
    //    Layout ready to hold thousands of emojis (scalable)
    // ============================================================
    function buildFullEmojiLibrary() {
        const container = document.getElementById('emojiCategoriesRoot');
        if (!container) return;
        container.innerHTML = '';

        for (let cat of emojiCategories) {
            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'emoji-category';

            const titleDiv = document.createElement('div');
            titleDiv.className = 'category-title';
            // title with sample icon
            const sampleIcon = cat.icons[0] || '🔹';
            titleDiv.innerHTML = `${sampleIcon}  ${cat.name}  <span style="font-size:0.75rem;">(${cat.icons.length})</span>`;
            categoryDiv.appendChild(titleDiv);

            const gridDiv = document.createElement('div');
            gridDiv.className = 'emoji-grid';

            // iterate over icons and build square buttons
            cat.icons.forEach(emoji => {
                const squareCard = document.createElement('div');
                squareCard.className = 'emoji-sq-btn';
                const emojiSpan = document.createElement('div');
                emojiSpan.className = 'big-emoji';
                emojiSpan.textContent = emoji;
                squareCard.appendChild(emojiSpan);
                
                // click event: copy + flash + sound
                squareCard.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyEmojiToClipboard(emoji, squareCard);
                });
                
                gridDiv.appendChild(squareCard);
            });
            categoryDiv.appendChild(gridDiv);
            container.appendChild(categoryDiv);
        }
    }

    // ============================================================
    // 4. DOUBLE CLICK → tools.html
    //    and triple click (optional) but double click is main.
    //    also ensures we ignore if clicking on music bar or interactive elements
    // ============================================================
    let clickSequence = 0;
    let dblTimer = null;

    function resetClickSequence() {
        clickSequence = 0;
        if (dblTimer) clearTimeout(dblTimer);
        dblTimer = null;
    }

    document.body.addEventListener('click', (e) => {
        // avoid double counting if click originates from gold bar or inside emoji card (but we still allow)
        // we want double-click ANYWHERE on body to redirect to tools.html.
        // However we need to detect double click globally.
        clickSequence++;
        if (dblTimer) clearTimeout(dblTimer);
        dblTimer = setTimeout(() => {
            if (clickSequence === 2) {
                // double click detected -> go to tools.html
                window.location.href = 'tools.html';
            }
            resetClickSequence();
        }, 230);
    });

    // optional: ensure that double-tap on mobile works smoothly
    document.body.addEventListener('touchend', (e) => {
        // we manage double tap same as click
        clickSequence++;
        if (dblTimer) clearTimeout(dblTimer);
        dblTimer = setTimeout(() => {
            if (clickSequence === 2) {
                window.location.href = 'tools.html';
            }
            resetClickSequence();
        }, 230);
    });

    // ============================================================
    // 5. PERFECT SQUARE & PERFORMANCE ENHANCEMENTS
    //    avoid horizontal scroll, fix css grid scaling
    // ============================================================
    function fixSquareRatio() {
        // all .emoji-sq-btn already use aspect-ratio:1/1, but we ensure any extra style
        const btns = document.querySelectorAll('.emoji-sq-btn');
        btns.forEach(btn => {
            if (!btn.style.aspectRatio) btn.style.aspectRatio = '1 / 1';
        });
    }

    // observe for dynamic content if needed, but after render we call it.
    // ============================================================
    // 6. INITIALIZE PAGE : render categories and attach final touches
    // ============================================================
    buildFullEmojiLibrary();
    fixSquareRatio();

    // little additional: after any future massive emoji addition, grid remains perfect
    // also ensure that the gold bar works and music context is ready.
    // preload audio files on hover? not needed, but we already initialized.
    console.log("✅ EmojiForge ready — square chic buttons, gold music bar, copy + flash, double-click to tools.");
</script>
