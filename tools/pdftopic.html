<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hegazi PDF Suite - Professional Offline Converter</title>
    <!-- Local JS Dependencies -->
    <script src="pdf.min.js"></script>
    <script src="jszip.min.js"></script>
    <style>
        :root { --accent: #00d2ff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #334155; margin-bottom: 25px; }
        .brand { font-size: 1.4rem; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        
        .panel { background: var(--card); padding: 20px; border-radius: 12px; display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.8rem; color: #94a3b8; font-weight: bold; }
        input, select { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; outline: none; }
        
        .btn { padding: 12px 24px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .btn-secondary { background: #475569; color: white; }

        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 30px; }
        .item { background: var(--card); padding: 10px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; position: relative; transition: 0.2s; }
        .item.active { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,210,255,0.3); }
        .item img { width: 100%; border-radius: 4px; display: block; background: #fff; }
        .num { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; }
        
        #status { font-weight: bold; color: var(--accent); margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">Eng. Ahmed Hegazi</div>
        <div id="status">Ready</div>
    </header>

    <div class="panel">
        <div class="group">
            <label>1. Select Document</label>
            <input type="file" id="pdfFile" accept="application/pdf">
        </div>
        <div class="group">
            <label>2. Quality Setting</label>
            <select id="dpi">
                <option value="1.5">Standard (Web)</option>
                <option value="3" selected>High (Print/Clear)</option>
                <option value="5">Ultra (Professional)</option>
            </select>
        </div>
        <button class="btn btn-secondary" onclick="toggleAll()">Select/Deselect All</button>
        <button class="btn btn-primary" id="exportBtn" disabled onclick="processExport()">Export to Image ZIP</button>
    </div>

    <div id="grid"></div>

    <script>
        // Set worker to local file
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        let pdfDoc = null;
        let selected = new Set();
        const grid = document.getElementById('grid');
        const status = document.getElementById('status');
        const exportBtn = document.getElementById('exportBtn');

        document.getElementById('pdfFile').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            status.innerText = "Processing PDF Structure...";
            grid.innerHTML = "";
            selected.clear();

            const reader = new FileReader();
            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                status.innerText = `Total Pages: ${pdfDoc.numPages}. Generating Previews...`;
                
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    await createThumb(i);
                }
                exportBtn.disabled = false;
                status.innerText = "Select pages to export.";
            };
            reader.readAsArrayBuffer(file);
        };

        async function createThumb(num) {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: 0.3 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<span class="num">Page ${num}</span><img src="${canvas.toDataURL()}">`;
            div.onclick = () => {
                if (selected.has(num)) { selected.delete(num); div.classList.remove('active'); }
                else { selected.add(num); div.classList.add('active'); }
            };
            grid.appendChild(div);
        }

        function toggleAll() {
            const items = document.querySelectorAll('.item');
            const allSelected = selected.size === pdfDoc.numPages;
            items.forEach((el, i) => {
                if (allSelected) { selected.delete(i+1); el.classList.remove('active'); }
                else { selected.add(i+1); el.classList.add('active'); }
            });
        }

        async function processExport() {
            if (selected.size === 0) return alert("Select at least one page!");
            
            const zip = new JSZip();
            const scale = parseFloat(document.getElementById('dpi').value);
            status.innerText = `Rendering ${selected.size} pages at high resolution...`;

            for (let num of [...selected].sort((a,b)=>a-b)) {
                const page = await pdfDoc.getPage(num);
                const viewport = page.getViewport({ scale: scale });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width; canvas.height = viewport.height;
                
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                const imgData = canvas.toDataURL('image/png').split(',')[1];
                zip.file(`Page_${num}.png`, imgData, { base64: true });
            }

            const blob = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "Hegazi_Project_Export.zip";
            a.click();
            status.innerText = "Export Successful!";
        }
        // الدبل كليك (في أي مكان على الشاشة)
        window.addEventListener('dblclick', () => {
            window.location.href = 'tools.html';
        });

        // للموبايل: محاكاة الدبل كليك باللمس السريع
        let lastTap = 0;
        window.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                window.location.href = 'tools.html';
            }
            lastTap = currentTime;
        });
    </script>
</body>
</html>
