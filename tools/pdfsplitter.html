<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Split Engine Pro | Eng. Ahmed Hegazi</title>
    <script src="pdf-lib.min.js"></script>
    <style>
        :root { --sun: #FFD700; --sun-bright: #fff700; --dark-bg: #030712; --card-bg: #0f172a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        .branding {
            position: fixed; top: 20px; left: 20px; font-weight: 900; font-size: 1.4rem;
            color: var(--sun); cursor: pointer; z-index: 2000; transition: 0.4s;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3); border-left: 3px solid var(--sun); padding-left: 10px;
        }
        .branding.active { text-shadow: 0 0 20px var(--sun-bright), 0 0 40px var(--sun); transform: scale(1.05); }

        .container { width: 100%; max-width: 800px; padding: 100px 20px 20px; text-align: center; }
        
        .control-panel {
            background: var(--card-bg); padding: 25px; border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.2); margin: 20px auto;
        }

        #drop-area {
            border: 2px dashed rgba(255, 215, 0, 0.4); width: 100%; padding: 40px 20px;
            text-align: center; border-radius: 20px; cursor: pointer; background: rgba(255, 215, 0, 0.02);
        }

        .file-display {
            background: #1e293b; padding: 20px; border-radius: 15px; margin-top: 20px;
            border: 1px solid var(--sun); display: none; text-align: left; position: relative;
        }

        #loader, #nameModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.95); z-index: 10001; justify-content: center; align-items: center; flex-direction: column; 
        }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 25px; border: 2px solid var(--sun); width: 85%; max-width: 400px;
        }
        .modal-content input {
            width: 100%; padding: 15px; margin: 15px 0; border-radius: 10px; border: 1px solid var(--sun); background: #000; color: #fff; text-align: center;
        }

        .btn { padding: 12px 30px; border-radius: 50px; border: none; cursor: pointer; font-weight: 800; text-transform: uppercase; transition: 0.3s; }
        .btn-split { background: var(--sun); color: #000; margin-top: 15px; }
    </style>
</head>
<body ondblclick="handleBack(event)">

    <div id="brand" class="branding" onclick="toggleSolarMusic()">Eng. Ahmed Hegazi</div>

    <div class="container">
        <h1 style="letter-spacing: 5px;">SPLIT <span style="color:var(--sun)">SOLAR</span></h1>
        
        <div id="drop-area" onclick="document.getElementById('fileInput').click()">
            UPLOAD PDF TO DISSECT
            <input type="file" id="fileInput" accept=".pdf" style="display:none" onchange="handleFile(this.files[0])">
        </div>

        <div id="fileDisplay" class="file-display">
            <div id="fileName" style="font-weight:bold; color:var(--sun); font-size:1.1rem;"></div>
            <div id="fileStats" style="font-size:12px; color:#94a3b8; margin-top:5px;"></div>
            
            <div class="control-panel">
                <div style="margin-bottom:10px;">Extract every:</div>
                <input type="number" id="pageStep" value="1" min="1" style="width:60px; padding:8px; border-radius:5px; border:1px solid var(--sun); background:#000; color:#fff; text-align:center;">
                <span>Pages</span>
                <br>
                <button class="btn btn-split" onclick="startSplitting()">✂️ Precision Split</button>
            </div>
        </div>
    </div>

    <div id="loader">
        <div style="width:60px; height:60px; border:5px solid var(--sun); border-top-color:transparent; border-radius:50%; animation: spin 1s linear infinite;"></div>
        <h2 style="color: var(--sun); margin-top: 20px;">SURGICAL SPLITTING...</h2>
        <p id="status" style="color: #94a3b8; font-family: monospace;"></p>
    </div>

    <audio id="bgMusic" src="music.wav" loop></audio>

    <script>
        const { PDFDocument } = PDFLib;
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');
        const audio = document.getElementById('bgMusic');
        const brand = document.getElementById('brand');
        let currentFile = null;

        function handleBack(e) { if(e.target === document.body) window.location.href = 'tools.html'; }

        function toggleSolarMusic() {
            if(audio.paused) { audio.play(); brand.classList.add('active'); }
            else { audio.pause(); brand.classList.remove('active'); }
        }

        async function handleFile(file) {
            if(!file) return;
            const buffer = await file.arrayBuffer();
            const pdf = await PDFDocument.load(buffer);
            currentFile = { name: file.name, data: buffer, pages: pdf.getPageCount() };
            
            document.getElementById('fileName').innerText = file.name;
            document.getElementById('fileStats').innerText = `Total Pages: ${currentFile.pages} | Size: ${(file.size/(1024*1024)).toFixed(2)} MB`;
            document.getElementById('fileDisplay').style.display = 'block';
            document.getElementById('drop-area').style.display = 'none';
        }

        async function startSplitting() {
            const step = parseInt(document.getElementById('pageStep').value);
            if (!step || step < 1) return alert("Basha, enter valid page number!");
            
            loader.style.display = 'flex';
            try {
                const sourcePdf = await PDFDocument.load(currentFile.data);
                const total = currentFile.pages;

                for (let i = 0; i < total; i += step) {
                    status.innerText = `Extracting Part ${Math.floor(i/step) + 1}...`;
                    
                    const newPdf = await PDFDocument.create();
                    const end = Math.min(i + step, total);
                    const range = Array.from({length: end - i}, (_, k) => i + k);
                    
                    // The Fix: Pure copying to a fresh document ensures minimum size
                    const copiedPages = await newPdf.copyPages(sourcePdf, range);
                    copiedPages.forEach(p => newPdf.addPage(p));
                    
                    const bytes = await newPdf.save();
                    download(bytes, `${currentFile.name.replace('.pdf','')}_Part_${(i/step)+1}.pdf`);
                    await new Promise(r => setTimeout(r, 100)); 
                }
            } catch (e) { alert("Split Error!"); }
            loader.style.display = 'none';
        }

        function download(bytes, name) {
            const blob = new Blob([bytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
    <style> @keyframes spin { 100% { transform: rotate(360deg); } } </style>
</body>
</html>
