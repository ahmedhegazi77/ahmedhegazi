<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merge Engine Pro | Eng. Ahmed Hegazi</title>
    <script src="pdf-lib.min.js"></script>
    <script src="sortable.min.js"></script>
    <style>
        :root { 
            --sun: #FFD700; 
            --sun-bright: #fff700;
            --dark-bg: #030712; 
            --card-bg: #0f172a; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--dark-bg); color: #fff; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Golden Branding */
        .branding {
            position: fixed; top: 20px; left: 20px; font-weight: 900; font-size: 1.4rem;
            color: var(--sun); cursor: pointer; z-index: 2000;
            transition: all 0.4s ease; user-select: none;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
            border-left: 3px solid var(--sun); padding-left: 10px;
        }
        .branding.active {
            text-shadow: 0 0 20px var(--sun-bright), 0 0 40px var(--sun);
            transform: scale(1.05);
        }

        .container { width: 100%; max-width: 1200px; padding: 80px 20px 20px; text-align: center; }
        
        .main-panel {
            background: var(--card-bg); padding: 15px 30px; border-radius: 50px;
            display: flex; gap: 15px; align-items: center; margin: 20px auto;
            border: 1px solid rgba(255, 215, 0, 0.2); width: fit-content;
            flex-wrap: wrap; justify-content: center;
        }

        #drop-area {
            border: 2px dashed rgba(255, 215, 0, 0.4); width: 100%; padding: 40px 20px;
            text-align: center; border-radius: 20px; cursor: pointer;
            background: rgba(255, 215, 0, 0.02); margin-top: 20px;
        }

        #file-list { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; width: 100%; padding: 30px 0; 
        }

        .file-card { 
            background: #1e293b; padding: 20px; border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.1); position: relative; cursor: grab;
            text-align: left; touch-action: none; /* Crucial for Mobile Drag */
        }
        .file-num {
            position: absolute; top: -10px; left: -10px; background: var(--sun);
            color: #000; width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .file-info { font-size: 12px; color: #94a3b8; margin-top: 8px; }
        .delete-btn { 
            position: absolute; top: 10px; right: 10px; background: #ef4444; 
            color: white; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer;
        }

        /* Modal & Loader */
        #loader, #nameModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.95); z-index: 10001; justify-content: center; align-items: center; flex-direction: column; 
        }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 25px;
            border: 2px solid var(--sun); text-align: center; width: 85%; max-width: 400px;
            box-shadow: 0 0 30px var(--sun);
        }
        .modal-content input {
            width: 100%; padding: 15px; margin: 20px 0; border-radius: 10px;
            border: 1px solid var(--sun); background: #000; color: #fff; text-align: center; font-size: 1.1rem;
        }

        .btn { 
            padding: 12px 30px; border-radius: 50px; border: none; cursor: pointer; 
            font-weight: 800; text-transform: uppercase; transition: 0.3s;
        }
        .btn-merge { background: var(--sun); color: #000; }
        .btn-merge:active { transform: scale(0.95); }

        @media (max-width: 600px) {
            .branding { font-size: 1.1rem; top: 15px; left: 15px; }
            .container { padding-top: 60px; }
            h1 { font-size: 1.8rem !important; }
        }
    </style>
</head>
<body ondblclick="handleBack(event)">

    <div id="brand" class="branding" onclick="toggleSolarMusic()">Eng. Ahmed Hegazi</div>

    <div class="container">
        <h1 style="font-size: 2.5rem; margin: 0; letter-spacing: 5px;">MERGE <span style="color:var(--sun)">ULTIMATE</span></h1>
        
        <div class="main-panel">
            <button class="btn btn-merge" onclick="processMerge()">🚀 Fusion All</button>
            <button class="btn" style="background:transparent; color:#ef4444; border:1px solid #ef4444" onclick="location.reload()">Reset</button>
        </div>

        <div id="drop-area" onclick="document.getElementById('fileInput').click()">
            TAP TO ADD PDF FILES
            <input type="file" id="fileInput" multiple accept=".pdf" style="display:none" onchange="handleFiles(this.files)">
        </div>

        <div id="file-list"></div>
    </div>

    <!-- Naming Modal -->
    <div id="nameModal">
        <div class="modal-content">
            <h3 style="color: var(--sun); margin: 0;">Name Your Fusion</h3>
            <input type="text" id="customFileName" placeholder="Enter file name...">
            <button class="btn btn-merge" style="width:100%" onclick="finalizeMerge()">Download to Device</button>
        </div>
    </div>

    <!-- Processing Loader -->
    <div id="loader">
        <div style="width:60px; height:60px; border:5px solid var(--sun); border-top-color:transparent; border-radius:50%; animation: spin 1s linear infinite;"></div>
        <h2 style="color: var(--sun); margin-top: 20px; letter-spacing: 3px;">FUSING...</h2>
        <p id="status" style="color: #94a3b8; font-family: monospace;"></p>
    </div>

    <audio id="bgMusic" src="music.wav" loop></audio>

    <script>
        const { PDFDocument } = PDFLib;
        const fileList = document.getElementById('file-list');
        const loader = document.getElementById('loader');
        const nameModal = document.getElementById('nameModal');
        const status = document.getElementById('status');
        const audio = document.getElementById('bgMusic');
        const brand = document.getElementById('brand');
        let loadedFiles = [];
        let finalBlobBytes = null;

        // Sorting Logic (Mouse & Touch)
        new Sortable(fileList, { 
            animation: 250,
            onEnd: updateOrder,
            delay: 50, // Helps with touch scrolling
            delayOnTouchOnly: true
        });

        function handleBack(e) {
            if(e.target === document.body || e.target.className === 'container') {
                window.location.href = 'tools.html';
            }
        }

        function toggleSolarMusic() {
            if(audio.paused) {
                audio.play();
                brand.classList.add('active');
            } else {
                audio.pause();
                brand.classList.remove('active');
            }
        }

        async function handleFiles(files) {
            for (const file of files) {
                const buffer = await file.arrayBuffer();
                const pdf = await PDFDocument.load(buffer);
                loadedFiles.push({
                    id: Math.random().toString(36).substr(2, 9),
                    name: file.name,
                    data: buffer,
                    size: (file.size / 1024 / 1024).toFixed(2),
                    pages: pdf.getPageCount()
                });
            }
            renderFiles();
        }

        function renderFiles() {
            fileList.innerHTML = '';
            loadedFiles.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'file-card';
                div.dataset.id = f.id;
                div.innerHTML = `
                    <div class="file-num">${i + 1}</div>
                    <button class="delete-btn" onclick="removeFile('${f.id}')">✕</button>
                    <div style="font-weight:bold; color:var(--sun); overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${f.name}</div>
                    <div class="file-info">${f.pages} Pages | ${f.size} MB</div>
                `;
                fileList.appendChild(div);
            });
        }

        function updateOrder() {
            const newOrder = [];
            document.querySelectorAll('.file-card').forEach(card => {
                newOrder.push(loadedFiles.find(f => f.id == card.dataset.id));
            });
            loadedFiles = newOrder;
            renderFiles();
        }

        function removeFile(id) {
            loadedFiles = loadedFiles.filter(f => f.id != id);
            renderFiles();
        }

        async function processMerge() {
            if (loadedFiles.length < 2) return alert("Select at least 2 files!");
            loader.style.display = 'flex';
            
            try {
                const mergedPdf = await PDFDocument.create();
                for (let i = 0; i < loadedFiles.length; i++) {
                    status.innerText = `Adding: ${loadedFiles[i].name}`;
                    const pdf = await PDFDocument.load(loadedFiles[i].data);
                    const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    pages.forEach(p => mergedPdf.addPage(p));
                }
                finalBlobBytes = await mergedPdf.save();
                loader.style.display = 'none';
                nameModal.style.display = 'flex';
            } catch (e) {
                alert("Error Fusing PDF!");
                loader.style.display = 'none';
            }
        }

        function finalizeMerge() {
            let name = document.getElementById('customFileName').value.trim();
            if (!name) name = "Hegazi_Fusion_Result";
            
            const blob = new Blob([finalBlobBytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${name}.pdf`;
            
            // Android Support Link Append
            document.body.appendChild(link);
            link.click();
            setTimeout(() => {
                document.body.removeChild(link);
                window.URL.revokeObjectURL(link.href);
            }, 100);

            nameModal.style.display = 'none';
            document.getElementById('customFileName').value = '';
        }
    </script>
    <style> @keyframes spin { 100% { transform: rotate(360deg); } } </style>
</body>
</html>
