<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AH BGEditor V1</title>
    <!-- TensorFlow + BodyPix -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* main card */
        .studio {
            max-width: 1300px;
            width: 100%;
            background: #111;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        /* inner layout */
        .workspace {
            display: flex;
            flex-wrap: wrap;
        }

        /* PANEL - small/medium not huge */
        .panel {
            width: 280px;
            background: #1a1a1a;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid #2a2a2a;
        }

        .panel h2 {
            font-size: 1.3rem;
            color: #00d4ff;
            letter-spacing: -0.3px;
            border-left: 3px solid #00d4ff;
            padding-left: 12px;
            margin-bottom: 4px;
        }

        .ctrl-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ctrl-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="file"] {
            background: #252525;
            border: 1px solid #333;
            color: #eee;
            padding: 8px 10px;
            border-radius: 14px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        input[type="color"] {
            width: 100%;
            height: 42px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 14px;
            cursor: pointer;
        }

        .opacity-slider {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .opacity-slider input {
            flex: 1;
            cursor: pointer;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
        }

        .btn-primary {
            background: #0077ff;
            color: white;
        }
        .btn-primary:hover { background: #0060dd; transform: scale(0.97);}

        .btn-success {
            background: #2c7a4d;
            color: white;
        }
        .btn-success:hover { background: #1f5e3a;}

        .btn-share {
            background: #3a3a5a;
            color: white;
        }
        .btn-share:hover { background: #2a2a48;}

        .color-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .color-chip {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.1s;
        }
        .color-chip:hover {
            transform: scale(1.1);
            border-color: white;
        }

        /* preview area */
        .preview-area {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 20%, #1a1a2a, #0a0a0a);
        }

        .canvas-wrapper {
            background: #000;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            background: #000;
            box-shadow: 0 0 0 1px #333;
        }

        .status {
            margin-top: 16px;
            font-size: 0.8rem;
            background: #1e1e2e;
            padding: 6px 14px;
            border-radius: 60px;
            color: #0af;
            font-weight: 500;
        }

        footer {
            background: #0c0c0c;
            padding: 12px 20px;
            text-align: center;
            font-size: 0.7rem;
            color: #555;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

<div class="studio">
    <div class="workspace">
        <!-- PANEL - compact but complete -->
        <div class="panel">
            <h2>🎛️ STUDIO</h2>
            
            <div class="ctrl-group">
                <label>📷 1. MAIN IMAGE (person)</label>
                <input type="file" id="personUpload" accept="image/*">
            </div>

            <div class="ctrl-group">
                <label>🖼️ 2. BACKGROUND IMAGE (optional)</label>
                <input type="file" id="bgUpload" accept="image/*">
            </div>

            <div class="ctrl-group">
                <label>🎨 SOLID COLOR BACKGROUND</label>
                <input type="color" id="solidColor" value="#0a2f6a">
                <div class="color-options" id="quickColors">
                    <!-- js will inject colors -->
                </div>
            </div>

            <div class="ctrl-group">
                <label>🌀 BACKGROUND OPACITY (no bg → transparent)</label>
                <div class="opacity-slider">
                    <span>0%</span>
                    <input type="range" id="opacitySlider" min="0" max="100" value="100">
                    <span>100%</span>
                </div>
            </div>

            <button class="btn btn-primary" id="removeBgBtn">✨ REMOVE BACKGROUND</button>
            <button class="btn btn-success" id="downloadBtn">💾 DOWNLOAD PNG</button>
            <button class="btn btn-share" id="shareBtn">🌐 SHARE (any app)</button>
        </div>

        <!-- PREVIEW -->
        <div class="preview-area">
            <div class="canvas-wrapper">
                <canvas id="outputCanvas" width="500" height="500" style="width:100%; height:auto; max-width:500px; aspect-ratio:1/1"></canvas>
            </div>
            <div class="status" id="statusMsg">⚡ ready — upload an image</div>
        </div>
    </div>
    <footer>AI Background Remover • BodyPix engine • Drag & share anywhere</footer>
</div>

<script>
    (function(){
        // ---------- DOM elements ----------
        const personUpload = document.getElementById('personUpload');
        const bgUpload = document.getElementById('bgUpload');
        const solidColorPicker = document.getElementById('solidColor');
        const opacitySlider = document.getElementById('opacitySlider');
        const removeBtn = document.getElementById('removeBgBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('statusMsg');

        // ---------- global vars ----------
        let net = null;
        let modelLoading = false;
        let currentPersonImg = new Image();
        let currentBgImg = new Image();
        let hasBgImage = false;
        let currentBgColor = '#0a2f6a';
        let bgOpacity = 1;      // 1 = fully solid, 0 = transparent
        let isUseColor = true;   // by default solid color

        // person image loaded flag
        let personReady = false;

        // quick color palette
        const quickColors = ['#000000','#ffffff','#ff3366','#33cc66','#ffaa33','#aa44ff','#00d4ff','#aa3333'];

        // ---------- init BodyPix ----------
        async function initModel() {
            if (net) return net;
            if (modelLoading) return;
            modelLoading = true;
            statusDiv.innerText = '🧠 loading AI model (BodyPix)...';
            try {
                net = await bodyPix.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    multiplier: 0.75,
                    quantBytes: 2
                });
                statusDiv.innerText = '✅ AI ready — upload a person image';
                modelLoading = false;
                return net;
            } catch(e) {
                statusDiv.innerText = '❌ model error: check network';
                modelLoading = false;
                return null;
            }
        }

        // draw canvas background based on current settings
        function drawBackground(width, height) {
            if (isUseColor) {
                // solid color with opacity
                let r, g, b;
                if (currentBgColor.startsWith('#')) {
                    r = parseInt(currentBgColor.slice(1,3), 16);
                    g = parseInt(currentBgColor.slice(3,5), 16);
                    b = parseInt(currentBgColor.slice(5,7), 16);
                } else {
                    r=0;g=0;b=0;
                }
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${bgOpacity})`;
                ctx.fillRect(0, 0, width, height);
            } 
            else if (hasBgImage && currentBgImg.src && currentBgImg.complete && currentBgImg.naturalWidth > 0) {
                // draw image with opacity (simulate by drawing then applying global alpha)
                ctx.save();
                ctx.globalAlpha = bgOpacity;
                ctx.drawImage(currentBgImg, 0, 0, width, height);
                ctx.restore();
            } 
            else {
                // fallback: black transparent if no bg and opacity 0
                ctx.fillStyle = `rgba(0,0,0, ${bgOpacity})`;
                ctx.fillRect(0, 0, width, height);
            }
        }

        // main removal logic
        async function removeBackground() {
            if (!net) {
                await initModel();
                if (!net) return;
            }
            if (!personReady || !currentPersonImg.src || currentPersonImg.width === 0) {
                statusDiv.innerText = '⚠️ upload a main image first';
                return;
            }

            statusDiv.innerText = '🪄 processing segmentation...';
            try {
                const segmentation = await net.segmentPerson(currentPersonImg, {
                    internalResolution: 'high',
                    segmentationThreshold: 0.65,
                    scoreThreshold: 0.5
                });

                // resize canvas to match person image
                canvas.width = currentPersonImg.width;
                canvas.height = currentPersonImg.height;
                
                // 1. draw background (color or image with opacity)
                drawBackground(canvas.width, canvas.height);
                
                // 2. create temp canvas with full person
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(currentPersonImg, 0, 0, canvas.width, canvas.height);
                
                const imgData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imgData.data;
                
                // mask: segmentation.data === 1 -> person, else transparent
                for (let i = 0; i < pixels.length; i += 4) {
                    const isPerson = segmentation.data[i / 4] === 1;
                    if (!isPerson) {
                        pixels[i+3] = 0;   // transparent
                    }
                }
                tempCtx.putImageData(imgData, 0, 0);
                
                // draw person on top
                ctx.drawImage(tempCanvas, 0, 0);
                
                statusDiv.innerText = '✅ background removed!';
            } catch(err) {
                console.error(err);
                statusDiv.innerText = '❌ error: ' + err.message;
            }
        }

        // ---------- image handlers ----------
        personUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                currentPersonImg.src = ev.target.result;
                currentPersonImg.onload = () => {
                    canvas.width = currentPersonImg.width;
                    canvas.height = currentPersonImg.height;
                    ctx.drawImage(currentPersonImg, 0, 0);
                    personReady = true;
                    statusDiv.innerText = '✅ person loaded — click REMOVE BACKGROUND';
                };
            };
            reader.readAsDataURL(file);
        });

        bgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            isUseColor = false;
            hasBgImage = true;
            const reader = new FileReader();
            reader.onload = (ev) => {
                currentBgImg.src = ev.target.result;
                currentBgImg.onload = () => {
                    statusDiv.innerText = '✅ background image ready';
                };
            };
            reader.readAsDataURL(file);
        });

        solidColorPicker.addEventListener('input', (e) => {
            currentBgColor = e.target.value;
            isUseColor = true;
            hasBgImage = false;
            statusDiv.innerText = '🎨 solid color selected';
        });

        opacitySlider.addEventListener('input', (e) => {
            bgOpacity = parseInt(e.target.value) / 100;
            statusDiv.innerText = `🌀 opacity: ${e.target.value}%`;
        });

        // quick color chips
        const colorContainer = document.getElementById('quickColors');
        quickColors.forEach(col => {
            const chip = document.createElement('div');
            chip.className = 'color-chip';
            chip.style.backgroundColor = col;
            chip.style.border = col === '#ffffff' ? '1px solid #aaa' : 'none';
            chip.addEventListener('click', () => {
                currentBgColor = col;
                solidColorPicker.value = col;
                isUseColor = true;
                hasBgImage = false;
                statusDiv.innerText = `🎨 quick color: ${col}`;
            });
            colorContainer.appendChild(chip);
        });

        removeBtn.addEventListener('click', removeBackground);

        downloadBtn.addEventListener('click', () => {
            if (!personReady) {
                alert('no image to download');
                return;
            }
            const link = document.createElement('a');
            link.download = 'bg_removed.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            statusDiv.innerText = '📸 image saved!';
        });

        // modern share api (or fallback)
        shareBtn.addEventListener('click', async () => {
            if (!personReady) {
                alert('first remove background to share');
                return;
            }
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                const file = new File([blob], 'artwork.png', { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Background Remover',
                        text: 'check my creation!',
                        files: [file]
                    });
                    statusDiv.innerText = '✨ shared successfully';
                } else {
                    // fallback: download or copy
                    const url = canvas.toDataURL();
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'bg_removed.png';
                    a.click();
                    statusDiv.innerText = '📎 share not supported — image downloaded';
                }
            } catch(err) {
                console.warn(err);
                statusDiv.innerText = '⚠️ sharing failed or cancelled';
            }
        });

        // preload model on page load
        initModel();

        // optional: maintain canvas aspect on window
        window.addEventListener('resize', () => {});
        console.log('🔥 PRO STUDIO ready — english UI, dual upload, color+opacity, universal share');
    })();


        // الدبل كليك (في أي مكان على الشاشة)
        window.addEventListener('dblclick', () => {
            window.location.href = 'tools.html';
        });

        // للموبايل: محاكاة الدبل كليك باللمس السريع
        let lastTap = 0;
        window.addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                window.location.href = 'tools.html';
            }
            lastTap = currentTime;
        });

</script>
</body>
</html>
